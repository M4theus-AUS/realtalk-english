    $main.innerHTML = `
      <div class="page-head">
        <div class="page-kicker">${groupLabel(s.group || "Daily Life")} · ${levelLabel(s.level)} · ${a.flag} ${isPT() ? "Inglês " + a.name : a.name + " English"}</div>
        <div class="page-title">${s.emoji} ${s.title}</div>
        ${pm ? `<div class="page-title-pt">${pm.title}</div>` : ""}
        <p class="page-blurb">${pm ? pm.blurb : T(s.blurb)}</p>
      </div>
      <div class="tab-row">
        ${TABS.map(([key, label]) => `<button class="tab-btn ${tab === key ? "active" : ""}" data-tab="${key}">${label}</button>`).join("")}
      </div>
      <div id="scenario-body"></div>`;
    $main.querySelectorAll(".tab-btn").forEach(btn => {
      btn.onclick = () => { location.hash = `#/scenario/${id}/${btn.dataset.tab}`; };
    });
    const body = document.getElementById("scenario-body");
    if (tab === "vocab") {
      body.innerHTML = renderVocab(s);
      body.querySelectorAll(".vocab-say").forEach(btn => {
        btn.onclick = () => RealTalkPlayer.speech.speak(btn.dataset.say, { isYou: false });
      });
    } else if (tab === "pov") {
      activePlayer = new RealTalkPlayer.ScenePlayer(body, s, { mode: "watch" });
    } else if (tab === "play" || tab === "speak") {
      activePlayer = new RealTalkPlayer.ScenePlayer(body, s, {
        mode: tab === "speak" ? "speak" : "tap",
        onComplete: ({ counts }) => store.sceneDone(id, counts)
      });
    } else {
      body.innerHTML = renderLearn(s);
    }
  }

  function renderVocab(s) {
    const v = window.VOCAB && window.VOCAB[s.id];
    if (!v || !v.words || !v.words.length) {
      return `<div class="card"><p style="color:var(--ink-soft)">${isPT() ? "Vocabulário chegando em breve para esta cena." : "Vocabulary coming soon for this scene."}</p></div>`;
    }
    return `
      <div class="card" style="margin-bottom:14px">
        <p style="color:var(--ink-soft)">${L("vocabIntro", { n: v.words.length })}</p>
      </div>
      <div class="vocab-grid">
        ${v.words.map(w => `
          <div class="vocab-card">
            <button class="vocab-say" data-say="${w.en.replace(/"/g, "&quot;")}" title="${isPT() ? "Ouvir" : "Listen"}">🔊</button>
            <div class="vocab-en">${w.en}</div>
            <div class="vocab-pt">${w.pt}</div>
            ${w.ex ? `<div class="vocab-ex">${w.ex}</div>` : ""}
          </div>`).join("")}
      </div>`;
  }

  function renderLearnExtra(s) {
    const x = window.LEARN_EXTRA && window.LEARN_EXTRA[s.id];
    if (!x) return "";
    let html = "";
    if (x.phrases2 && x.phrases2.length) {
      html += `
        <div class="card" style="margin-top:14px">
          <h3 style="margin-bottom:8px">${L("phrases2Title")}</h3>
          ${x.phrases2.map(p => `<div class="phrase-row"><span class="phrase-en">${T(p.en)}</span><span class="phrase-note">${T(p.note)}</span></div>`).join("")}
        </div>`;
    }
    if (x.dialogue && x.dialogue.lines) {
      html += `
        <div class="card" style="margin-top:14px">
          <h3 style="margin-bottom:8px">🎭 ${x.dialogue.title || (isPT() ? "Diálogo bônus" : "Bonus dialogue")}</h3>
          ${x.dialogue.lines.map(l => `
            <div class="dialogue-line">
              <span class="dialogue-who">${l.who}</span>
              <span class="dialogue-text">${l.en}${isPT() && l.pt ? `<span class="dialogue-pt">${l.pt}</span>` : ""}</span>
            </div>`).join("")}
        </div>`;
    }
    if (x.culture && x.culture.length) {
      html += `
        <div class="card" style="margin-top:14px">
          <h3 style="margin-bottom:8px">${L("cultureTitle")}</h3>
          ${x.culture.map(c => `<div class="culture-item">${c}</div>`).join("")}
        </div>`;
    }
    return html;
  }

  function renderLearn(s) {
    const L2 = s.learn;
    const a = accentMeta();
    const slang = T(L2.slang) || [];
    return `
      <div class="card" style="margin-bottom:14px">
        <p style="color:var(--ink-soft)">${T(L2.intro)}</p>
      </div>
      <div class="grid grid-2" style="align-items:start">
        <div class="card">
          <h3 style="margin-bottom:8px">${L("keyPhrases")}</h3>
          ${[...L2.phrases, ...(window.RTBuilder ? RTBuilder.addedPhrases(s.id) : [])].map(p => `<div class="phrase-row"><span class="phrase-en">${T(p.en)}</span><span class="phrase-note">${T(p.note)}</span></div>`).join("")}
        </div>
        <div>
          <div class="card" style="margin-bottom:14px">
            <h3 style="margin-bottom:10px">${a.flag} ${L("slangTitle")}</h3>
            ${slang.map(x => `<span class="slang-chip"><b>${T(x.term)}</b> — ${T(x.meaning)}</span>`).join("")}
          </div>
          <div class="card">
            <h3 style="margin-bottom:8px">${L("tips")}</h3>
            <ul style="padding-left:20px;color:var(--ink-soft)">${L2.tips.map(t => `<li style="margin:6px 0">${T(t)}</li>`).join("")}</ul>
          </div>
        </div>
      </div>
      <div class="card" style="margin-top:14px">
        <h3 style="margin-bottom:6px">${L("traps")}</h3>
        <table class="compare-table">
          <tr><th>${L("dontSay")}</th><th>${L("say")}</th><th>${L("why")}</th></tr>
          ${L2.mistakes.map(m => `<tr><td class="wrong">${T(m.wrong)}</td><td class="right">${T(m.right)}</td><td>${T(m.why)}</td></tr>`).join("")}
        </table>
        <div style="margin-top:10px;display:flex;gap:10px;flex-wrap:wrap">
          <a class="btn" href="#/scenario/${s.id}/pov">${L("watchFirst")}</a>
          <a class="btn ghost" href="#/scenario/${s.id}/play">${L("playScene")}</a>
          <a class="btn ghost" href="#/scenario/${s.id}/speak">${L("speakIt")}</a>
        </div>
      </div>
      ${renderLearnExtra(s)}`;
  }

  // ---------- router ----------
  function route() {
    if (activePlayer) { activePlayer.destroy(); activePlayer = null; }
    const parts = (location.hash.replace(/^#\//, "") || "home").split("/");
    window.scrollTo(0, 0);
    switch (parts[0]) {
      case "admin":
        if (isAdmin() && window.RTAdmin) {
          RTAdmin.renderPanel($main, SCENARIOS, (contentChanged) => {
            if (contentChanged) renderChrome();
            route(); // re-renders the panel with fresh data (selection is kept)
          });
        } else pageHome();
        break;
      case "grammar": parts[1] ? pageLesson(parts[1]) : pageGrammar(); break;
      case "exercises": parts[1] ? pageQuiz(parts[1]) : pageExercises(); break;
      case "scenario": pageScenario(parts[1], parts[2]); break;
      default: pageHome();
    }
    highlightNav();
    if (window.RTFX) requestAnimationFrame(() => RTFX.enhance($main));
    if (window.RTBuilder) RTBuilder.afterRender(
      parts.join("/") || "home",
      { scenarioIds: SCENARIOS.map(s => s.id), tab: parts[0] === "scenario" ? (parts[2] || "learn") : null, sceneId: parts[0] === "scenario" ? parts[1] : null }
    );
  }

  // ---------- sound toggle ----------
  const soundBtn = document.getElementById("sound-toggle");
  soundBtn.onclick = () => {
    RealTalkPlayer.speech.enabled = !RealTalkPlayer.speech.enabled;
    if (!RealTalkPlayer.speech.enabled) RealTalkPlayer.speech.stop();
    soundBtn.textContent = RealTalkPlayer.speech.enabled ? L("voiceOn") : L("voiceOff");
  };

  window.addEventListener("hashchange", route);

  function startApp() {
    store.load();
    applyTheme();
    renderChrome();
    if (window.RTBuilder) RTBuilder.mount();
    route();
  }

  if (window.RTAuth && !RTAuth.current()) {
    applyTheme();
    RTAuth.showLogin(startApp);
  } else {
    startApp();
  }
})();

</script>
</body>
</html>
