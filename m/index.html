<script>
// RealTalk — lightweight profile system (static-site "login").
// Profiles live in this browser's localStorage: each person gets their own
// name, avatar and progress. Real cross-device accounts need a backend later.
(function () {
  const USERS_KEY = "realtalk-users";
  const CURRENT_KEY = "realtalk-user";
  const AVATARS = ["🧑🏻", "👩🏻", "🧔🏽", "👩🏾", "🧑🏼‍🦱", "👱🏻‍♀️", "🧑🏿", "👨🏼‍🦰"];

  function readUsers() {
    try { return JSON.parse(localStorage.getItem(USERS_KEY)) || []; }
    catch { return []; }
  }
  function writeUsers(users) { localStorage.setItem(USERS_KEY, JSON.stringify(users)); }

  const RTAuth = {
    users: readUsers,
    current() {
      const name = localStorage.getItem(CURRENT_KEY);
      if (!name) return null;
      return readUsers().find(u => u.name === name) || null;
    },
    login(name, avatar) {
      name = (name || "").trim().slice(0, 24);
      if (!name) return null;
      const users = readUsers();
      let u = users.find(x => x.name.toLowerCase() === name.toLowerCase());
      if (u && u.admin) return null; // admin only enters via PIN
      if (!u) {
        u = { name, avatar: avatar || AVATARS[0], created: new Date().toISOString() };
        users.push(u);
        writeUsers(users);
      } else if (avatar) {
        u.avatar = avatar;
        writeUsers(users);
      }
      localStorage.setItem(CURRENT_KEY, u.name);
      // adopt pre-profile progress once, so nobody loses their streak
      const legacy = localStorage.getItem("realtalk-progress");
      const userKey = "realtalk-progress::" + u.name;
      if (legacy && !localStorage.getItem(userKey)) {
        localStorage.setItem(userKey, legacy);
        localStorage.removeItem("realtalk-progress");
      }
      return u;
    },
    logout() {
      localStorage.removeItem(CURRENT_KEY);
      location.reload();
    },
    isAdmin() {
      const u = this.current();
      return !!(u && u.admin);
    },
    loginAdmin(pin) {
      const stored = localStorage.getItem("realtalk-admin-pin");
      if (!stored) {
        if (!pin || pin.length < 4) return { ok: false, setup: true };
        localStorage.setItem("realtalk-admin-pin", pin);
      } else if (pin !== stored) {
        return { ok: false };
      }
      const users = readUsers();
      let u = users.find(x => x.admin);
      if (!u) {
        u = { name: "Admin", avatar: "🛠️", admin: true, created: new Date().toISOString() };
        users.push(u);
        writeUsers(users);
      }
      localStorage.setItem(CURRENT_KEY, u.name);
      return { ok: true };
    },
    progressKey() {
      const u = this.current();
      return "realtalk-progress::" + (u ? u.name : "guest");
    },

    showLogin(onDone) {
      const isPT = window.RT_LANG === "pt";
      const users = readUsers();
      const ov = document.createElement("div");
      ov.className = "login-screen";
      ov.innerHTML = `
        <div class="login-card">
          <div class="login-brand">🎬 <b>RealTalk</b><span>real life english</span></div>
          <h2>${isPT ? "Quem está aprendendo hoje?" : "Who's learning today?"}</h2>
          ${users.filter(u => !u.admin).length ? `
            <div class="login-users">
              ${users.filter(u => !u.admin).map(u => `<button class="login-user" data-name="${u.name.replace(/"/g, "&quot;")}"><span>${u.avatar}</span>${u.name}</button>`).join("")}
            </div>
            <div class="login-or">${isPT ? "ou crie um novo perfil" : "or create a new profile"}</div>` : `
            <p class="login-sub">${isPT ? "Crie seu perfil — seu progresso fica salvo neste aparelho." : "Create your profile — your progress is saved on this device."}</p>`}
          <div class="login-avatars">
            ${AVATARS.map((a, i) => `<button class="login-avatar ${i === 0 ? "picked" : ""}" data-a="${a}">${a}</button>`).join("")}
          </div>
          <input class="login-input" id="login-name" maxlength="24" placeholder="${isPT ? "Seu nome" : "Your name"}" autocomplete="off">
          <button class="btn cta login-go" id="login-go">${isPT ? "▶ Começar" : "▶ Start learning"}</button>
        </div>`;
      document.body.appendChild(ov);

      let picked = AVATARS[0];
      ov.querySelectorAll(".login-avatar").forEach(b => {
        b.onclick = () => {
          ov.querySelectorAll(".login-avatar").forEach(x => x.classList.remove("picked"));
          b.classList.add("picked");
          picked = b.dataset.a;
        };
      });
      const go = () => {
        const name = ov.querySelector("#login-name").value;
        // typing "admin" opens the PIN flow instead of a normal profile
        if (name.trim().toLowerCase() === "admin") {
          const hasPin = !!localStorage.getItem("realtalk-admin-pin");
          const card = ov.querySelector(".login-card");
          card.innerHTML = `
            <div class="login-brand">🛠️ <b>Admin</b><span>realtalk studio</span></div>
            <h2>${hasPin ? (isPT ? "Digite o PIN" : "Enter your PIN") : (isPT ? "Crie um PIN de admin" : "Create an admin PIN")}</h2>
            <p class="login-sub">${hasPin ? (isPT ? "Acesso ao painel de edição da plataforma." : "Access to the platform editing panel.") : (isPT ? "Mínimo 4 dígitos. Guarde bem — fica salvo só neste navegador." : "Min 4 digits. It's stored in this browser only.")}</p>
            <input class="login-input" id="admin-pin" type="password" inputmode="numeric" maxlength="12" placeholder="PIN">
            <div class="login-sub" id="admin-err" style="color:var(--coral);display:none">${isPT ? "PIN errado." : "Wrong PIN."}</div>
            <button class="btn cta login-go" id="admin-go">${isPT ? "Entrar como Admin" : "Enter as Admin"}</button>`;
          const tryPin = () => {
            const r = RTAuth.loginAdmin(card.querySelector("#admin-pin").value);
            if (r.ok) { ov.remove(); onDone && onDone(); }
            else { card.querySelector("#admin-err").style.display = "block"; card.querySelector("#admin-pin").select(); }
          };
          card.querySelector("#admin-go").onclick = tryPin;
          card.querySelector("#admin-pin").addEventListener("keydown", e => { if (e.key === "Enter") tryPin(); });
          setTimeout(() => card.querySelector("#admin-pin").focus(), 100);
          return;
        }
        if (!RTAuth.login(name, picked)) {
          ov.querySelector("#login-name").focus();
          return;
        }
        ov.remove();
        onDone && onDone();
      };
      ov.querySelector("#login-go").onclick = go;
      ov.querySelector("#login-name").addEventListener("keydown", e => { if (e.key === "Enter") go(); });
      ov.querySelectorAll(".login-user").forEach(b => {
        b.onclick = () => {
          RTAuth.login(b.dataset.name);
          ov.remove();
          onDone && onDone();
        };
      });
      setTimeout(() => ov.querySelector("#login-name")?.focus(), 300);
    }
  };

  window.RTAuth = RTAuth;
})();

</script>
<script>
// RealTalk — admin override layer + in-app editing panel.
// Edits are stored in localStorage ("realtalk-admin-overrides") and merged over
// the shipped content at load time, so the admin changes the platform in the
// platform. Export downloads the overrides as JSON to make them permanent.
(function () {
  const KEY = "realtalk-admin-overrides";

  function load() {
    try { return JSON.parse(localStorage.getItem(KEY)) || {}; }
    catch { return {}; }
  }
  function save(data) { localStorage.setItem(KEY, JSON.stringify(data)); }

  const RTAdmin = {
    data: load(),

    // Merge overrides into the shipped content (runs before the app builds its lists).
    apply() {
      const d = this.data;
      const allScenes = [...(window.SCENARIOS_A || []), ...(window.SCENARIOS_B || []), ...(window.SCENARIOS_C || []), ...(window.SCENARIOS_D || [])];
      if (d.meta) {
        for (const [id, m] of Object.entries(d.meta)) {
          const s = allScenes.find(x => x.id === id);
          if (s && m.title) s.title = m.title;
          if (s && m.blurb) s.blurb = m.blurb;
          if (window.PT_META && window.PT_META[id]) {
            if (m.titlePt) window.PT_META[id].title = m.titlePt;
            if (m.blurbPt) window.PT_META[id].blurb = m.blurbPt;
          }
        }
      }
      if (d.vocab && window.VOCAB) {
        for (const [id, words] of Object.entries(d.vocab)) {
          if (Array.isArray(words)) window.VOCAB[id] = { words };
        }
      }
      this.hidden = Array.isArray(d.hidden) ? d.hidden : [];
    },

    saveNow() { save(this.data); },
    setMeta(id, meta) {
      this.data.meta = this.data.meta || {};
      this.data.meta[id] = meta;
      save(this.data);
    },
    setVocab(id, words) {
      this.data.vocab = this.data.vocab || {};
      this.data.vocab[id] = words;
      save(this.data);
    },
    setHidden(id, hide) {
      const set = new Set(this.data.hidden || []);
      hide ? set.add(id) : set.delete(id);
      this.data.hidden = [...set];
      save(this.data);
    },
    isHidden(id) { return (this.data.hidden || []).includes(id); },

    exportJson() {
      const blob = new Blob([JSON.stringify(this.data, null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "realtalk-overrides.json";
      a.click();
      URL.revokeObjectURL(a.href);
    },
    importJson(file, cb) {
      const r = new FileReader();
      r.onload = () => {
        try {
          this.data = JSON.parse(r.result) || {};
          save(this.data);
          cb && cb(true);
        } catch { cb && cb(false); }
      };
      r.readAsText(file);
    },
    reset() {
      localStorage.removeItem(KEY);
      this.data = {};
    },

    // ---------- panel ----------
    renderPanel(container, scenarios, refresh) {
      const isPT = window.RT_LANG === "pt";
      const t = (pt, en) => isPT ? pt : en;
      const selId = this._sel || scenarios[0].id;
      this._sel = selId;
      const s = scenarios.find(x => x.id === selId) || scenarios[0];
      const pm = (window.PT_META && window.PT_META[s.id]) || {};
      const words = (window.VOCAB && window.VOCAB[s.id] && window.VOCAB[s.id].words) || [];

      container.innerHTML = `
        <div class="page-head">
          <div class="page-kicker">🛠️ Admin</div>
          <div class="page-title">${t("Painel da Plataforma", "Platform Panel")}</div>
          <p class="page-blurb">${t(
            "Suas edições valem na hora, salvas neste navegador. Use Exportar para baixar o arquivo de mudanças e torná-las permanentes no site publicado.",
            "Your edits apply instantly and are saved in this browser. Use Export to download the changes file and make them permanent on the published site."
          )}</p>
        </div>

        <div class="card" style="margin-bottom:14px">
          <label class="admin-label">${t("Cena para editar", "Scene to edit")}</label>
          <select class="admin-select" id="adm-scene">
            ${scenarios.map(x => `<option value="${x.id}" ${x.id === s.id ? "selected" : ""}>${x.emoji} ${x.title}${RTAdmin.isHidden(x.id) ? " (oculta)" : ""}</option>`).join("")}
          </select>
          <label class="admin-check"><input type="checkbox" id="adm-hidden" ${RTAdmin.isHidden(s.id) ? "checked" : ""}> ${t("Ocultar esta cena da plataforma", "Hide this scene from the platform")}</label>
        </div>

        <div class="card" style="margin-bottom:14px">
          <h3 style="margin-bottom:10px">${t("Título e descrição", "Title & description")}</h3>
          <label class="admin-label">${t("Título (inglês)", "Title (English)")}</label>
          <input class="admin-input" id="adm-title" value="${(s.title || "").replace(/"/g, "&quot;")}">
          <label class="admin-label">${t("Título (português)", "Title (Portuguese)")}</label>
          <input class="admin-input" id="adm-title-pt" value="${(pm.title || "").replace(/"/g, "&quot;")}">
          <label class="admin-label">${t("Descrição (português)", "Blurb (Portuguese)")}</label>
          <input class="admin-input" id="adm-blurb-pt" value="${(pm.blurb || "").replace(/"/g, "&quot;")}">
          <button class="btn" id="adm-save-meta" style="margin-top:10px">${t("Salvar título/descrição", "Save title/blurb")}</button>
        </div>

        <div class="card" style="margin-bottom:14px">
          <h3 style="margin-bottom:4px">${t("Vocabulário desta cena", "This scene's vocabulary")} (${words.length})</h3>
          <p style="font-size:12.5px;color:var(--ink-faint);margin-bottom:10px">${t("Edite, apague ou adicione palavras — inglês · português · exemplo.", "Edit, delete or add words — English · Portuguese · example.")}</p>
          <div id="adm-vocab">
            ${words.map((w, i) => `
              <div class="admin-vocab-row" data-i="${i}">
                <input class="admin-input v-en" value="${(w.en || "").replace(/"/g, "&quot;")}" placeholder="English">
                <input class="admin-input v-pt" value="${(w.pt || "").replace(/"/g, "&quot;")}" placeholder="Português">
                <input class="admin-input v-ex" value="${(w.ex || "").replace(/"/g, "&quot;")}" placeholder="${t("Exemplo", "Example")}">
                <button class="admin-del" title="${t("Apagar", "Delete")}">✕</button>
              </div>`).join("")}
          </div>
          <div style="display:flex;gap:10px;margin-top:10px;flex-wrap:wrap">
            <button class="btn ghost" id="adm-add-word">＋ ${t("Adicionar palavra", "Add word")}</button>
            <button class="btn" id="adm-save-vocab">${t("Salvar vocabulário", "Save vocabulary")}</button>
          </div>
        </div>

        <div class="card">
          <h3 style="margin-bottom:8px">${t("Mudanças da plataforma", "Platform changes")}</h3>
          <div style="display:flex;gap:10px;flex-wrap:wrap">
            <button class="btn" id="adm-export">⬇ ${t("Exportar mudanças (JSON)", "Export changes (JSON)")}</button>
            <label class="btn ghost" style="cursor:pointer">⬆ ${t("Importar", "Import")}<input type="file" id="adm-import" accept=".json" style="display:none"></label>
            <button class="btn ghost" id="adm-reset" style="color:var(--wrong-text);border-color:var(--coral)">${t("Zerar tudo", "Reset all")}</button>
          </div>
          <p style="font-size:12.5px;color:var(--ink-faint);margin-top:10px">${t(
            "O arquivo exportado é o pacote das suas edições — me envie para publicar de forma permanente, ou importe em outro navegador.",
            "The exported file is your edit bundle — send it to be published permanently, or import it in another browser."
          )}</p>
        </div>`;

      const $ = (q) => container.querySelector(q);
      $("#adm-scene").onchange = (e) => { this._sel = e.target.value; refresh(); };
      $("#adm-hidden").onchange = (e) => { RTAdmin.setHidden(s.id, e.target.checked); refresh(); };
      $("#adm-save-meta").onclick = () => {
        RTAdmin.setMeta(s.id, {
          title: $("#adm-title").value.trim(),
          titlePt: $("#adm-title-pt").value.trim(),
          blurbPt: $("#adm-blurb-pt").value.trim()
        });
        RTAdmin.apply();
        refresh(true);
      };
      $("#adm-add-word").onclick = () => {
        const row = document.createElement("div");
        row.className = "admin-vocab-row";
        row.innerHTML = `<input class="admin-input v-en" placeholder="English"><input class="admin-input v-pt" placeholder="Português"><input class="admin-input v-ex" placeholder="Ex."><button class="admin-del">✕</button>`;
        row.querySelector(".admin-del").onclick = () => row.remove();
        $("#adm-vocab").appendChild(row);
        row.querySelector(".v-en").focus();
      };
      container.querySelectorAll(".admin-del").forEach(b => {
        b.onclick = () => b.closest(".admin-vocab-row").remove();
      });
      $("#adm-save-vocab").onclick = () => {
        const rows = [...container.querySelectorAll(".admin-vocab-row")];
        const newWords = rows.map(r => ({
          en: r.querySelector(".v-en").value.trim(),
          pt: r.querySelector(".v-pt").value.trim(),
          ex: r.querySelector(".v-ex").value.trim()
        })).filter(w => w.en);
        RTAdmin.setVocab(s.id, newWords);
        RTAdmin.apply();
        refresh(true);
      };
      $("#adm-export").onclick = () => RTAdmin.exportJson();
      $("#adm-import").onchange = (e) => {
        if (e.target.files[0]) RTAdmin.importJson(e.target.files[0], ok => {
          if (ok) { RTAdmin.apply(); location.reload(); }
          else alert(isPT ? "Arquivo inválido." : "Invalid file.");
        });
      };
      $("#adm-reset").onclick = () => {
        if (confirm(isPT ? "Apagar TODAS as edições de admin?" : "Delete ALL admin edits?")) {
          RTAdmin.reset();
          location.reload();
        }
      };
    }
  };

  RTAdmin.apply();
  window.RTAdmin = RTAdmin;
})();

</script>
<script>
// RealTalk — Building mode (admin): edit the platform inside the platform.
// Double-click any text to rewrite it · reorder scene cards · recolor the theme
// · add phrases. Everything lands in RTAdmin's override bundle (exportable).
(function () {
  const isPT = () => window.RT_LANG === "pt";
  const t = (pt, en) => isPT() ? pt : en;

  const RTB = {
    on: false,
    _route: "home",

    bdata() {
      if (!window.RTAdmin) return {};
      RTAdmin.data.build = RTAdmin.data.build || {};
      return RTAdmin.data.build;
    },
    save() { if (window.RTAdmin && RTAdmin.saveNow) RTAdmin.saveNow(); },

    // ---------- mount: floating tools for admins ----------
    mount() {
      if (!window.RTAuth || !RTAuth.isAdmin() || document.getElementById("build-fab")) return;
      const fab = document.createElement("button");
      fab.id = "build-fab";
      fab.className = "build-fab";
      fab.innerHTML = "🔨";
      fab.title = t("Modo Construção", "Building mode");
      fab.onclick = () => this.toggle();
      document.body.appendChild(fab);

      const panel = document.createElement("div");
      panel.id = "build-panel";
      panel.className = "build-panel";
      panel.style.display = "none";
      document.body.appendChild(panel);

      // one delegated dblclick listener for text editing
      document.addEventListener("dblclick", (e) => {
        if (!this.on) return;
        const main = document.getElementById("main");
        const side = document.getElementById("scenario-nav");
        if (!main.contains(e.target) && !(side && side.contains(e.target))) return;
        let el = e.target;
        // walk down to a reasonable editable block (leaf-ish)
        if (el.children.length > 2 || el.id === "main") return;
        if (el.closest(".viewport, .choice-area, .build-panel")) return;
        e.preventDefault();
        const original = el.textContent;
        el.setAttribute("contenteditable", "true");
        el.classList.add("build-editing");
        el.focus();
        const finish = () => {
          el.removeAttribute("contenteditable");
          el.classList.remove("build-editing");
          const now = el.textContent;
          if (now !== original && now.trim()) {
            const d = this.bdata();
            d.texts = d.texts || [];
            // replace an earlier override of the same original on this route
            d.texts = d.texts.filter(o => !(o.route === this._route && o.original === original));
            d.texts.push({ route: this._route, original, text: now });
            this.save();
          }
          el.removeEventListener("blur", finish);
        };
        el.addEventListener("blur", finish);
        el.addEventListener("keydown", (ke) => { if (ke.key === "Enter") { ke.preventDefault(); el.blur(); } });
      });
    },

    toggle() {
      this.on = !this.on;
      document.body.classList.toggle("building", this.on);
      document.getElementById("build-fab").classList.toggle("active", this.on);
      const panel = document.getElementById("build-panel");
      panel.style.display = this.on ? "block" : "none";
      if (this.on) this.renderToolPanel();
      // re-render so order buttons appear/disappear
      if (window.dispatchEvent) window.dispatchEvent(new HashChangeEvent("hashchange"));
    },

    renderToolPanel() {
      const panel = document.getElementById("build-panel");
      const acc = window.RT_ACCENT;
      const c = (this.bdata().colors || {})[acc] || {};
      const cs = getComputedStyle(document.documentElement);
      const cur = (v, fallbackVar) => v || cs.getPropertyValue(fallbackVar).trim() || "#2f8f6b";
      panel.innerHTML = `
        <div class="bp-title">🔨 ${t("Modo Construção", "Building mode")}</div>
        <div class="bp-hint">✎ ${t("Dê dois cliques em qualquer texto para reescrever.", "Double-click any text to rewrite it.")}</div>
        <div class="bp-hint">↔ ${t("Na Início, use ‹ › nos cards para mudar a ordem.", "On Home, use ‹ › on cards to reorder.")}</div>
        <div class="bp-hint">＋ ${t("Na aba Aprender: botão para adicionar frases.", "On the Learn tab: button to add phrases.")}</div>
        <div class="bp-sec">🎨 ${t("Cores deste sotaque", "This accent's colors")} (${acc.toUpperCase()})</div>
        <div class="bp-colors">
          ${[["green", t("Principal", "Primary")], ["deep", t("Escura", "Deep")], ["bg", t("Fundo", "Background")], ["cta", "CTA"]].map(([k, label]) => `
            <label>${label}<input type="color" data-k="${k}" value="${cur(c[k], k === "green" ? "--green" : k === "deep" ? "--green-deep" : k === "bg" ? "--bg" : "--cta")}"></label>`).join("")}
        </div>
        <div class="bp-row">
          <button class="btn ghost bp-btn" id="bp-reset-colors">${t("Cores padrão", "Default colors")}</button>
          <button class="btn bp-btn" id="bp-export">⬇ ${t("Exportar tudo", "Export all")}</button>
        </div>`;
      panel.querySelectorAll("input[type=color]").forEach(inp => {
        inp.oninput = () => {
          const d = this.bdata();
          d.colors = d.colors || {};
          d.colors[acc] = d.colors[acc] || {};
          d.colors[acc][inp.dataset.k] = inp.value;
          this.save();
          this.applyColors();
        };
      });
      panel.querySelector("#bp-reset-colors").onclick = () => {
        const d = this.bdata();
        if (d.colors) delete d.colors[acc];
        this.save();
        ["--green", "--green-deep", "--bg", "--cta", "--green-wash"].forEach(v => document.documentElement.style.removeProperty(v));
        this.renderToolPanel();
      };
      panel.querySelector("#bp-export").onclick = () => RTAdmin.exportJson();
    },

    // custom colors for the current accent (runs after every theme apply)
    applyColors() {
      const root = document.documentElement;
      ["--green", "--green-deep", "--bg", "--cta", "--green-wash"].forEach(v => root.style.removeProperty(v));
      const c = (this.bdata().colors || {})[window.RT_ACCENT];
      if (!c) return;
      if (c.green) {
        root.style.setProperty("--green", c.green);
        root.style.setProperty("--green-wash", `color-mix(in srgb, ${c.green} 14%, white)`);
      }
      if (c.deep) root.style.setProperty("--green-deep", c.deep);
      if (c.bg) root.style.setProperty("--bg", c.bg);
      if (c.cta) root.style.setProperty("--cta", c.cta);
    },

    // scenario display order (Home + sidebar)
    orderOf(id) {
      const ord = this.bdata().order;
      if (!Array.isArray(ord)) return null;
      const i = ord.indexOf(id);
      return i < 0 ? null : i;
    },
    sortScenarios(list) {
      const ord = this.bdata().order;
      if (!Array.isArray(ord) || !ord.length) return list;
      return [...list].sort((a, b) => {
        const ia = ord.indexOf(a.id), ib = ord.indexOf(b.id);
        return (ia < 0 ? 999 : ia) - (ib < 0 ? 999 : ib);
      });
    },
    moveScenario(id, dir, allIds) {
      const d = this.bdata();
      let ord = Array.isArray(d.order) && d.order.length ? d.order.filter(x => allIds.includes(x)) : [...allIds];
      allIds.forEach(x => { if (!ord.includes(x)) ord.push(x); });
      const i = ord.indexOf(id);
      const j = i + dir;
      if (i < 0 || j < 0 || j >= ord.length) return;
      [ord[i], ord[j]] = [ord[j], ord[i]];
      d.order = ord;
      this.save();
    },

    // extra phrases added by the admin (merged into the Learn tab)
    addedPhrases(sceneId) {
      const p = this.bdata().phrases;
      return (p && p[sceneId]) || [];
    },
    addPhrase(sceneId) {
      const en = prompt(t("Frase em inglês:", "Phrase in English:"));
      if (!en || !en.trim()) return false;
      const note = prompt(t("Nota/explicação (pode ser em português):", "Note/explanation:")) || "";
      const d = this.bdata();
      d.phrases = d.phrases || {};
      d.phrases[sceneId] = d.phrases[sceneId] || [];
      d.phrases[sceneId].push({ en: en.trim(), note: note.trim() });
      this.save();
      return true;
    },

    // after each route render: re-apply saved text rewrites; add build controls
    afterRender(routeKey, ctx) {
      this._route = routeKey.split("/")[0] === "scenario" ? routeKey : routeKey.split("/")[0] || "home";
      const d = this.bdata();
      // 1) text overrides (match by exact original text, leaf elements only)
      if (d.texts && d.texts.length) {
        const scope = [document.getElementById("main"), document.getElementById("scenario-nav")];
        d.texts.forEach(o => {
          if (o.route !== this._route && o.route !== "home") return;
          scope.forEach(root => {
            if (!root) return;
            const walker = document.createTreeWalker(root, NodeFilter.SHOW_ELEMENT);
            let el;
            while ((el = walker.nextNode())) {
              if (el.children.length === 0 && el.textContent === o.original) {
                el.textContent = o.text;
              }
            }
          });
        });
      }
      // 2) build-mode controls
      if (!this.on) return;
      // reorder arrows on home cards
      if (this._route === "home" && ctx && ctx.scenarioIds) {
        document.querySelectorAll("#main .scenario-card[href^='#/scenario/']").forEach(card => {
          const id = card.getAttribute("href").split("/")[2];
          if (!id || card.querySelector(".bp-order")) return;
          const ctr = document.createElement("div");
          ctr.className = "bp-order";
          ctr.innerHTML = `<button data-d="-1">‹</button><button data-d="1">›</button>`;
          ctr.querySelectorAll("button").forEach(b => {
            b.onclick = (e) => {
              e.preventDefault(); e.stopPropagation();
              this.moveScenario(id, +b.dataset.d, ctx.scenarioIds);
              window.dispatchEvent(new HashChangeEvent("hashchange"));
            };
          });
          card.style.position = "relative";
          card.appendChild(ctr);
        });
      }
      // "+ add phrase" on learn tab
      if (this._route.startsWith("scenario") && ctx && ctx.tab === "learn" && ctx.sceneId) {
        const firstCardH3 = [...document.querySelectorAll("#scenario-body .card h3")][0];
        if (firstCardH3 && !document.getElementById("bp-add-phrase")) {
          const btn = document.createElement("button");
          btn.id = "bp-add-phrase";
          btn.className = "btn ghost bp-btn";
          btn.style.marginTop = "10px";
          btn.textContent = "＋ " + t("Adicionar frase", "Add phrase");
          btn.onclick = () => {
            if (this.addPhrase(ctx.sceneId)) window.dispatchEvent(new HashChangeEvent("hashchange"));
          };
          firstCardH3.closest(".card").appendChild(btn);
        }
      }
    }
  };

  window.RTBuilder = RTB;
})();

</script>
<script>
// RealTalk — retro pixel scene engine (GBA-era RPG style).
// NPC sprites on tiled pixel sets, 2-frame idle, blink, talk-mouth,
// and classic RPG emotes: ! ? sweat anger sparkles. Crisp pixels, no smoothing.
(function () {

  // ---------- palettes per scene ----------
  const CAST = {
    coffee:     { style: "bun",   hair: "#6b4632", skin: "#f6cfa0", top: "#c9484f", pants: "#4a5568" },
    food:       { style: "beard", hair: "#3d2c1e", skin: "#e0a878", top: "#5c8a4a", pants: "#3f3a32" },
    directions: { style: "short", hair: "#b8b0a0", skin: "#f6cfa0", top: "#4a6a9c", pants: "#5a544a" },
    smalltalk:  { style: "short", hair: "#2e241c", skin: "#e0a878", top: "#8aa04a", pants: "#4a4550" },
    phone:      { style: "long",  hair: "#7a5236", skin: "#f6cfa0", top: "#d9a04a", pants: "#5c4a6a" },
    haircut:    { style: "beard", hair: "#241c14", skin: "#eab887", top: "#4a4a58", pants: "#32302e" },
    doctor:     { style: "bun",   hair: "#241c14", skin: "#c08a5c", top: "#f2f2ea", pants: "#6a7280" },
    renting:    { style: "short", hair: "#4f3822", skin: "#f6cfa0", top: "#3f5878", pants: "#2e3444" },
    setup:      { style: "curly", hair: "#1c140f", skin: "#96683f", top: "#3f8a80", pants: "#4a5568" },
    interview:  { style: "long",  hair: "#8a4f2a", skin: "#f8dcb2", top: "#7a4658", pants: "#3a3644" },
    flirting:   { style: "long",  hair: "#c25a3a", skin: "#f8dcb2", top: "#e08a9c", pants: "#4a6a9c" },
    casual:     { style: "beard", hair: "#6b4632", skin: "#eab887", top: "#c9704a", pants: "#4a6a9c" },
    worktalk:   { style: "curly", hair: "#241c14", skin: "#96683f", top: "#5c5c7a", pants: "#32303c" },
    airport:    { style: "bun",   hair: "#2e241c", skin: "#e0a878", top: "#2e3a5c", pants: "#232c44" },
    shopping:   { style: "long",  hair: "#3d2c1e", skin: "#f6cfa0", top: "#c9648a", pants: "#3a3644" },
    rideshare:  { style: "beard", hair: "#4f3822", skin: "#c08a5c", top: "#5c7a8a", pants: "#3f3a32" },
    emergency:  { style: "short", hair: "#6b4632", skin: "#f6cfa0", top: "#3f8a52", pants: "#32403a" }
  };

  function shade(hex, f) {
    const n = parseInt(hex.slice(1), 16);
    const c = (s) => Math.max(0, Math.min(255, Math.round(((n >> s) & 255) * f)));
    return `#${((1 << 24) + (c(16) << 16) + (c(8) << 8) + c(0)).toString(16).slice(1)}`;
  }

  // ---------- character sprite (18 wide x 26 tall) ----------
  // keys: O outline, H hair, D hair shade, S skin, s skin shade, W eye white,
  // E eye dark, R mouth, T shirt, U shirt shade, P pants, p pants shade,
  // K blush, . transparent
  const HEAD = {
    short: [
      "..................",
      "..................",
      ".....OOOOOOOO.....",
      "....OHHHHHHHHO....",
      "...OHHHHHHHHHHO...",
      "...OHHHHHHHHHHO...",
      "...OHDHHHHHHDHO...",
      "...OHSSSSSSSSHO..."
    ],
    bun: [
      "........OOO.......",
      ".......OHHHO......",
      "....OOOOHHHOO.....",
      "....OHHHHHHHHO....",
      "...OHHHHHHHHHHO...",
      "...OHHHHHHHHHHO...",
      "...OHDHHHHHHDHO...",
      "...OHSSSSSSSSHO..."
    ],
    long: [
      "..................",
      "..................",
      ".....OOOOOOOO.....",
      "....OHHHHHHHHO....",
      "...OHHHHHHHHHHO...",
      "..OHHHHHHHHHHHHO..",
      "..OHHDHHHHHHDHHO..",
      "..OHHSSSSSSSSHHO.."
    ],
    curly: [
      "..................",
      "....O.OOOOOO.O....",
      "...OHOHHHHHHOHO...",
      "..OHHHHHHHHHHHHO..",
      "..OHHHHHHHHHHHHO..",
      "...OHHHHHHHHHHO...",
      "...OHDHHHHHHDHO...",
      "...OHSSSSSSSSHO..."
    ],
    beard: [
      "..................",
      "..................",
      ".....OOOOOOOO.....",
      "....OHHHHHHHHO....",
      "...OHHHHHHHHHHO...",
      "...OHHHHHHHHHHO...",
      "...OHDHHHHHHDHO...",
      "...OHSSSSSSSSHO..."
    ]
  };

  // face rows 8-13 per expression (eyes rows 8-9, cheeks 10, mouth 11-12, chin 13)
  const FACE = {
    normal: [
      "...OSWWESSWWESO...".replace("...O", "...O"),
      "...OSWWESSWWESO...",
      "...OSSSSSSSSSSO...",
      "...OSSSSRRSSSSO...",
      "...OSSSSSSSSSSO...",
      "....OSSSSSSSSO...."
    ],
    blink: [
      "...OSSSSSSSSSSO...",
      "...OSEESSSSEESO...",
      "...OSSSSSSSSSSO...",
      "...OSSSSRRSSSSO...",
      "...OSSSSSSSSSSO...",
      "....OSSSSSSSSO...."
    ],
    talk: [
      "...OSWWESSWWESO...",
      "...OSWWESSWWESO...",
      "...OSSSSSSSSSSO...",
      "...OSSSROORSSSO...",
      "...OSSSSRRSSSSO...",
      "....OSSSSSSSSO...."
    ],
    happy: [
      "...OSEESSSSEESO...",
      "...OSSSSSSSSSSO...",
      "...OKKSSSSSSKKO...",
      "...OSSSRRRRSSSO...",
      "...OSSSSRRSSSSO...",
      "....OSSSSSSSSO...."
    ],
    happytalk: [
      "...OSEESSSSEESO...",
      "...OSSSSSSSSSSO...",
      "...OKKSSSSSSKKO...",
      "...OSSSROORSSSO...",
      "...OSSSSRRSSSSO...",
      "....OSSSSSSSSO...."
    ],
    shock: [
      "...OSWWWSSWWWSO...",
      "...OSWEWSSWEWSO...",
      "...OSWWWSSWWWSO...",
      "...OSSSROORSSSO...",
      "...OSSSSOOSSSSO...",
      "....OSSSSSSSSO...."
    ],
    flat: [
      "...OSSSSSSSSSSO...",
      "...OSEEESSEEESO...",
      "...OSSSSSSSSSSO...",
      "...OSSREEEERSSO...",
      "...OSSSSSSSSSSO...",
      "....OSSSSSSSSO...."
    ],
    frown: [
      "...OSWWESSWWESO...",
      "...OSWWESSWWESO...",
      "...OSSSSSSSSSSO...",
      "...OSSSSRRSSSSO...",
      "...OSSSRSSRSSSO...",
      "....OSSSSSSSSO...."
    ],
    annoyed: [
      "...OSEEESSEEESO...",
      "...OSWWESSWWESO...",
      "...OSSSSSSSSSSO...",
      "...OSSREEEERSSO...",
      "...OSSSSSSSSSSO...",
      "....OSSSSSSSSO...."
    ]
  };

  // body rows 14-25 (shoulders->feet); outfit variants
  function bodyRows(garment) {
    const base = [
      "....OOTTTTTTOO....",
      "...OTTTTTTTTTTO...",
      "..OTTTTTTTTTTTTO..",
      "..OSTTTTTTTTTTSO..",
      "..OSTTTUTTUTTTSO..",
      "...OTTTTTTTTTTO...",
      "...OTTTTTTTTTTO...",
      "....OPPPPPPPPO....",
      "....OPPPOOPPPO....",
      "....OPPO..OPPO....",
      "....OppO..OppO....",
      "....OOO....OOO...."
    ];
    if (garment === "apron") {
      base[2] = "..OTTAAAAAAAATTO..".replace(/A/g, "A");
      base[3] = "..OSTAAAAAAAATSO..";
      base[4] = "..OSTAAAAAAAATSO..";
      base[5] = "...OTAAAAAAAATO...";
      base[6] = "...OTAAAAAAAATO...";
    } else if (garment === "coat") {
      base[1] = "...OWWTTTTTTWWO...";
      base[2] = "..OWWTTTTTTTTWWO..";
      base[3] = "..OSWTTTTTTTTWSO..";
      base[4] = "..OSWTTUTTUTTWSO..";
      base[5] = "...OWTTTTTTTTWO...";
      base[6] = "...OWTTTTTTTTWO...";
    } else if (garment === "tie") {
      base[2] = "..OTTTTTRRTTTTTO..";
      base[3] = "..OSTTTTRRTTTTSO..";
      base[4] = "..OSTTTTRRTTTTSO..";
    } else if (garment === "stripes") {
      base[2] = "..OWWWWWWWWWWWWO..";
      base[4] = "..OSWWWWWWWWWWSO..";
      base[6] = "...OWWWWWWWWWWO...";
    }
    return base;
  }

  const OUTFIT = { coffee: "apron", doctor: "coat", renting: "tie", interview: "tie", worktalk: "tie", flirting: "stripes" };

  // ---------- emote sprites (drawn above the head) ----------
  const EMOTES = {
    exclaim: { pal: { R: "#e04838", W: "#fff2e0", O: "#402820" }, rows: [
      ".OOO.", "OWRWO", "OWRWO", "OWRWO", ".ORO.", ".OOO.", ".ORO.", ".OOO."
    ] },
    question: { pal: { R: "#4a78c9", W: "#fff2e0", O: "#283048" }, rows: [
      ".OOOO.", "OWRRWO", "OW..RO", "..ORO.", "..ORO.", "..OO..", "..OR..", "..OO.."
    ] },
    sweat: { pal: { R: "#7ac0e8", W: "#d8f0fc", O: "#3a688a" }, rows: [
      "..O..", ".ORO.", ".ORO.", "ORRWO", "ORRWO", ".OOO."
    ] },
    anger: { pal: { R: "#e04838", O: "#e04838" }, rows: [
      "R.R.R", ".RRR.", "RR.RR", ".RRR.", "R.R.R"
    ] },
    sparkle: { pal: { R: "#f2d060", W: "#fdf6d8", O: "#c99a30" }, rows: [
      "..R..", ".RWR.", "RWWWR", ".RWR.", "..R.."
    ] },
    heart: { pal: { R: "#e06a8a", O: "#a03a52" }, rows: [
      ".RR.RR.", "RRRRRRR", "RRRRRRR", ".RRRRR.", "..RRR..", "...R..."
    ] }
  };

  function drawGrid(ctx, rows, pal, ox, oy) {
    rows.forEach((row, y) => {
      for (let x = 0; x < row.length; x++) {
        const k = row[x];
        if (k === "." || k === " ") continue;
        const col = pal[k];
        if (!col) continue;
        ctx.fillStyle = col;
        ctx.fillRect(ox + x, oy + y, 1, 1);
      }
    });
  }

  class Character {
    constructor(container, sceneId) {
      this.root = container;
      this.sceneId = sceneId;
      const c = CAST[sceneId] || CAST.smalltalk;
      this.pal = {
        O: "#33283a", H: c.hair, D: shade(c.hair, .7), S: c.skin, s: shade(c.skin, .82),
        W: "#ffffff", E: "#2b2026", R: "#b8504a", T: c.top, U: shade(c.top, .72),
        P: c.pants, p: shade(c.pants, .72), K: "#eb9a8a", A: "#e8dcc0"
      };
      this.head = HEAD[(c.style in HEAD) ? c.style : "short"];
      this.beard = c.style === "beard";
      this.body = bodyRows(OUTFIT[sceneId]);
      this.root.classList.add("pixel-char");
      this.root.innerHTML = `
        <canvas class="px-canvas" width="18" height="27"></canvas>
        <canvas class="px-emote" width="8" height="8"></canvas>
        <div class="fx-speedlines" id="fx-speed"></div>`;
      this.cv = this.root.querySelector(".px-canvas");
      this.ecv = this.root.querySelector(".px-emote");
      this.ctx = this.cv.getContext("2d");
      this.ectx = this.ecv.getContext("2d");
      this.face = "normal";
      this.emote = null;
      this.bounce = 0;
      this.shakeX = 0;
      this.timers = [];
      this.talkTimer = null;
      this.draw();
      this._startLife();
    }

    draw() {
      const ctx = this.ctx;
      ctx.clearRect(0, 0, 18, 27);
      const oy = 1 + this.bounce;
      const ox = this.shakeX;
      drawGrid(ctx, this.head, this.pal, ox, oy - (this.head === HEAD.bun ? 0 : 0));
      let face = FACE[this.face] || FACE.normal;
      drawGrid(ctx, face, this.pal, ox, oy + 8);
      if (this.beard) {
        drawGrid(ctx, ["...OHSSSSSSSSHO...", "....OHHHHHHHHO...."], { O: this.pal.O, H: this.pal.H, S: this.pal.S }, ox, oy + 12);
      }
      drawGrid(ctx, this.body, this.pal, ox, oy + 14);
      // emote
      const e = this.ectx;
      e.clearRect(0, 0, 8, 8);
      if (this.emote && EMOTES[this.emote]) {
        const em = EMOTES[this.emote];
        drawGrid(e, em.rows, em.pal, Math.floor((8 - em.rows[0].length) / 2), 0);
        this.ecv.style.display = "block";
      } else {
        this.ecv.style.display = "none";
      }
    }

    _startLife() {
      // 2-frame idle bounce, RPG style
      this.timers.push(setInterval(() => {
        if (this.reacting) return;
        this.bounce = this.bounce === 0 ? 0 : 0; // idle body static; breathing via head? keep subtle:
        this.draw();
      }, 600));
      // blink
      const blink = () => {
        if (!this.reacting && (this.face === "normal" || this.face === "talk")) {
          const prev = this.face;
          this.face = "blink";
          this.draw();
          this.timers.push(setTimeout(() => { if (this.face === "blink") { this.face = prev; this.draw(); } }, 150));
        }
        this.timers.push(setTimeout(blink, 2200 + Math.random() * 3000));
      };
      this.timers.push(setTimeout(blink, 1500));
    }

    destroy() {
      this.timers.forEach(t => { clearTimeout(t); clearInterval(t); });
      clearInterval(this.talkTimer);
      clearTimeout(this.reactTimer);
    }

    _set(face, emote) {
      this.face = face;
      this.emote = emote || null;
      this.draw();
    }

    setMood(mood) {
      if (this.reacting) return;
      switch (mood) {
        case "friendly": this._set("normal", null); break;
        case "neutral":  this._set("flat", null); break;
        case "confused": this._set("frown", "question"); break;
        case "amused":   this._set("happy", null); break;
        case "awkward":  this._set("flat", "sweat"); break;
        case "worried":  this._set("frown", "sweat"); break;
        default:         this._set("normal", null);
      }
    }

    react(quality) {
      clearTimeout(this.reactTimer);
      this.reacting = true;
      if (quality === "natural") {
        this._set("happy", "sparkle");
        // little double hop
        let hops = 0;
        const hop = setInterval(() => {
          this.bounce = this.bounce === 0 ? -2 : 0;
          this.draw();
          if (++hops >= 6) { clearInterval(hop); this.bounce = 0; this.draw(); }
        }, 110);
        this.timers.push(hop);
      } else if (quality === "awkward") {
        this._set("flat", "sweat");
        this.bounce = 1;
        this.draw();
        this.timers.push(setTimeout(() => { this.bounce = 0; this.draw(); }, 1200));
      } else {
        // the classic "!" surprise, then anger mark
        this._set("shock", "exclaim");
        let shakes = 0;
        const sh = setInterval(() => {
          this.shakeX = this.shakeX === 0 ? 1 : (this.shakeX === 1 ? -1 : 0);
          this.draw();
          if (++shakes >= 8) { clearInterval(sh); this.shakeX = 0; this.draw(); }
        }, 70);
        this.timers.push(sh);
        this.reactTimer = setTimeout(() => {
          this._set("annoyed", "anger");
        }, 1300);
      }
      setTimeout(() => { this.reacting = false; }, 2400);
    }

    setTalking(on) {
      clearInterval(this.talkTimer);
      if (on) {
        let open = false;
        this.talkTimer = setInterval(() => {
          if (this.reacting) return;
          open = !open;
          if (this.face === "happy" || this.face === "happytalk") this.face = open ? "happytalk" : "happy";
          else if (this.face === "normal" || this.face === "talk" || this.face === "blink") this.face = open ? "talk" : "normal";
          this.draw();
        }, 160);
      } else {
        if (this.face === "talk") this.face = "normal";
        if (this.face === "happytalk") this.face = "happy";
        this.draw();
      }
    }

    setVisible(on) { this.root.style.display = on ? "" : "none"; }
  }

  // ============ tiled pixel environments (96 x 54 grid) ============
  const GW = 96, GH = 54, FLOOR_Y = 36;

  function px(ctx, x, y, w, h, col) { ctx.fillStyle = col; ctx.fillRect(x, y, w, h); }

  function wallAndFloor(ctx, wall, wallLine, floor, floorAlt) {
    px(ctx, 0, 0, GW, FLOOR_Y, wall);
    for (let y = 4; y < FLOOR_Y; y += 6) px(ctx, 0, y, GW, 1, wallLine);
    px(ctx, 0, FLOOR_Y, GW, GH - FLOOR_Y, floor);
    for (let y = FLOOR_Y; y < GH; y += 4) {
      for (let x = ((y / 4) % 2) * 4; x < GW; x += 8) px(ctx, x, y, 4, 4, floorAlt);
    }
    px(ctx, 0, FLOOR_Y, GW, 1, "#33283a");
  }
  function shelfPx(ctx, x, w) {
    px(ctx, x, 6, w, 26, "#6b5a44");
    px(ctx, x, 6, w, 1, "#33283a"); px(ctx, x, 31, w, 1, "#33283a");
    px(ctx, x, 6, 1, 26, "#33283a"); px(ctx, x + w - 1, 6, 1, 26, "#33283a");
    const cols = ["#c9584a", "#d9a04a", "#7a9c4a", "#4a78c9", "#c9c05a", "#9c5a8a"];
    [12, 20, 28].forEach((sy, r) => {
      px(ctx, x + 1, sy, w - 2, 1, "#4a3c2e");
      let gx = x + 2, i = r * 2;
      while (gx < x + w - 4) {
        const gw = 2 + (i % 2), gh = 3 + (i % 3);
        px(ctx, gx, sy - gh, gw, gh, cols[i % cols.length]);
        gx += gw + 1; i++;
      }
    });
  }
  function windowPx(ctx, x, y, w, h, night) {
    px(ctx, x, y, w, h, night ? "#3a4468" : "#a8d8e0");
    if (!night) { px(ctx, x + 1, y + h - 4, w - 2, 3, "#8ab06a"); px(ctx, x + 2, y + 2, 3, 2, "#f2ede0"); }
    else px(ctx, x + w - 4, y + 2, 2, 2, "#f2e2b0");
    px(ctx, x, y, w, 1, "#33283a"); px(ctx, x, y + h - 1, w, 1, "#33283a");
    px(ctx, x, y, 1, h, "#33283a"); px(ctx, x + w - 1, y, 1, h, "#33283a");
    px(ctx, x + Math.floor(w / 2), y, 1, h, "#33283a");
  }
  function counterPx(ctx, top, wood) {
    px(ctx, 0, 40, GW, 14, wood);
    px(ctx, 0, 40, GW, 2, shade(wood, 1.3));

  function menuPx(ctx, x, y, w, h) {

<script>
// RealTalk — POV scene engine. Modes: tap / watch / speak.
// Dialogue is always English (voice + main caption); when the app language is PT,
// a Portuguese subtitle renders under the English line, and teaching text
// (notes, feedback) shows Portuguese first with the English original beneath.
(function () {
  const MOOD_AVATARS = {
    friendly: "🙂", neutral: "😐", confused: "🤨", amused: "😄", awkward: "😬", worried: "😟"
  };
  // A real person per scene — the character you're actually talking to.
  const CAST = {
    coffee: "👩🏻‍🦱", food: "🧔🏽", directions: "👨🏼‍🦳", smalltalk: "👨🏽",
    phone: "👩🏼‍💼", haircut: "🧔🏻", doctor: "👩🏽‍⚕️", renting: "👨🏻‍💼",
    setup: "🧑🏾", interview: "👩🏼‍💼", flirting: "🧑🏻‍🦰", casual: "🧔🏼", worktalk: "👩🏾‍💼"
  };
  const MOOD_LABELS = {
    en: { friendly: "friendly", neutral: "neutral", confused: "confused…", amused: "amused", awkward: "awkward…", worried: "worried!" },
    pt: { friendly: "simpático", neutral: "neutro", confused: "confuso…", amused: "achando graça", awkward: "sem graça…", worried: "preocupada!" }
  };
  const WORD_MS = 260;
  const MATCH_THRESHOLD = 0.42;
  const isPT = () => window.RT_LANG === "pt";
  const moodLabel = (m) => (MOOD_LABELS[isPT() ? "pt" : "en"][m]) || m;
  const qualityTag = (q) => q === "natural" ? L("fbNatural") : q === "awkward" ? L("fbAwkward") : L("fbWrong");

  // ---------- speech synthesis ----------
  const speech = {
    enabled: true,
    voices: [],
    load() {
      if (!window.speechSynthesis) return;
      const set = () => { this.voices = speechSynthesis.getVoices(); };
      set();
      speechSynthesis.onvoiceschanged = set;
    },
    // Rank every installed voice: right accent first, then voice quality.
    // Edge exposes cloud "Natural" neural voices (all 6 accents!); Chrome ships
    // "Google" voices (US/UK); legacy Microsoft David/Zira score lowest.
    rank(v, prefs) {
      let score = 0;
      for (let i = 0; i < prefs.length; i++) {
        const re = new RegExp("^" + prefs[i].replace(/-/g, "[-_]"), "i");
        if (re.test(v.lang)) { score += (prefs.length - i) * 100; break; }
      }
      if (score === 0 && /^en/i.test(v.lang)) score += 20;
      if (/natural/i.test(v.name)) score += 60;
      else if (/online/i.test(v.name)) score += 45;
      else if (/google/i.test(v.name)) score += 40;
      else if (/neural|premium|enhanced/i.test(v.name)) score += 35;
      return score;
    },
    pick() {
      const vs = this.voices;
      if (!vs.length) return null;
      const accent = window.ACCENTS && window.ACCENTS[window.RT_ACCENT];
      const prefs = (accent && accent.voices) || ["en-AU", "en-GB"];
      let best = null, bestScore = -1;
      for (const v of vs) {
        const s = this.rank(v, prefs);
        if (s > bestScore) { bestScore = s; best = v; }
      }
      this.lastPicked = best;
      return best;
    },
    speak(text, { isYou = false, onEnd, character } = {}) {
      if (!this.enabled || !window.speechSynthesis || !text) { onEnd && onEnd(false); return null; }
      speechSynthesis.cancel();
      const clean = text.replace(/\(.*?\)/g, "").trim();
      if (!clean) { onEnd && onEnd(false); return null; }
      const u = new SpeechSynthesisUtterance(clean);
      const v = this.pick();
      if (v) u.voice = v;
      // each scene's character gets a stable voice personality; tiny human jitter per line
      let charPitch = 1.05, charRate = 1.0;
      if (character) {
        let h = 0;
        for (let i = 0; i < character.length; i++) h = (h * 31 + character.charCodeAt(i)) % 997;
        charPitch = 0.96 + (h % 5) * 0.045;      // 0.96 – 1.14
        charRate = 0.94 + ((h >> 3) % 4) * 0.03;  // 0.94 – 1.03
      }
      const jitter = (Math.random() - 0.5) * 0.04;
      u.rate = (isYou ? 0.99 : charRate) + jitter;
      u.pitch = isYou ? 0.82 : charPitch;
      let done = false;
      const finish = () => { if (!done) { done = true; onEnd && onEnd(true); } };
      u.onend = finish;
      u.onerror = finish;
      const est = Math.max(1600, clean.split(/\s+/).length * 420);
      setTimeout(finish, est + 1500);
      speechSynthesis.speak(u);
      return u;
    },
    stop() { if (window.speechSynthesis) speechSynthesis.cancel(); }
  };
  speech.load();

  // ---------- speech recognition ----------
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const recognition = {
    supported: !!SR,
    active: null,
    listen({ onResult, onError }) {
      if (!SR) { onError("unsupported"); return; }
      this.stop();
      const r = new SR();
      const acc = window.ACCENTS[window.RT_ACCENT];
      r.lang = (acc && acc.recog) || "en-US";
      r.interimResults = false;
      r.maxAlternatives = 3;
      let got = false;
      r.onresult = (e) => {
        got = true;
        const alts = [...e.results[0]].map(a => a.transcript);
        onResult(alts);
      };
      r.onerror = (e) => { if (!got) onError(e.error || "error"); };
      r.onend = () => { if (!got) onError("no-speech"); this.active = null; };
      this.active = r;
      try { r.start(); } catch { onError("error"); }
    },
    stop() { if (this.active) { try { this.active.abort(); } catch {} this.active = null; } }
  };

  function normalize(s) {
    return (s || "").toLowerCase().replace(/\(.*?\)/g, "").replace(/[^a-z0-9'\s]/g, " ").split(/\s+/).filter(Boolean);
  }
  function similarity(a, b) {
    const ta = normalize(a), tb = normalize(b);
    if (!ta.length || !tb.length) return 0;
    const setB = [...tb];
    let common = 0;
    for (const w of ta) {
      const i = setB.indexOf(w);
      if (i >= 0) { common++; setB.splice(i, 1); }
    }
    return (2 * common) / (ta.length + tb.length);
  }

  // ---------- player ----------
  class ScenePlayer {
    constructor(container, scenario, { mode = "tap", onComplete } = {}) {
      this.root = container;
      this.sc = scenario;
      this.scene = scenario.scene;
      this.pt = (window.PT_SCENES && window.PT_SCENES[scenario.id]) || null;
      this.mode = mode;
      this.onComplete = onComplete;
      this.counts = { natural: 0, awkward: 0, wrong: 0 };
      this.missed = [];
      this.timers = [];
      this.destroyed = false;
      this.renderShell();
      if (mode === "watch") this.renderWatchIntro();
      else this.goto(this.scene.start);
    }

    ptNode(id) { return (this.pt && this.pt.nodes && this.pt.nodes[id]) || null; }

    destroy() {
      this.destroyed = true;
      speech.stop();
      recognition.stop();
      if (this.anime && this.anime.destroy) this.anime.destroy();
      this.timers.forEach(clearTimeout);
      this.timers = [];
    }
    later(fn, ms) { this.timers.push(setTimeout(() => { if (!this.destroyed) fn(); }, ms)); }

    renderShell() {
      const [c1, c2] = this.sc.bg || ["#333", "#666"];
      const modeLabel = this.mode === "watch" ? L("modeWatch") : this.mode === "speak" ? L("modeSpeak") : L("modeTap");
      const setting = T(this.scene.setting);
      const ptSetting = isPT() && this.pt && this.pt.setting;
      this.root.innerHTML = `
        <div class="player-wrap">
          <p class="page-blurb" style="margin-bottom:14px">🎬 <em>${ptSetting || setting}</em>${ptSetting ? `<span class="sub-en">${setting}</span>` : ""}</p>
          <div class="viewport">
            <div class="vp-scene vp-anime" style="background:radial-gradient(ellipse at 60% 35%, ${c2}, ${c1})">
              <div class="vp-avatar" id="vp-avatar"></div>
            </div>
            <video id="vp-video" style="display:none" playsinline></video>
            <div class="vp-rec"><span class="dot"></span> REC</div>
            <div class="vp-pov">${modeLabel}</div>
            <div class="vp-mood" id="vp-mood" style="display:none"></div>
            <div class="vp-caption">
              <div class="vp-speaker" id="vp-speaker"></div>
              <div class="vp-line" id="vp-line"></div>
              <div class="vp-line-pt" id="vp-line-pt"></div>
            </div>
          </div>
          <div class="swap-note" id="voice-note">${L("swapNote")}</div>
          <div class="choice-area" id="choice-area"></div>
          <div id="clip-rack"></div>
        </div>`;
      this.$avatar = this.root.querySelector("#vp-avatar");
      this.anime = window.RTAnime ? new RTAnime.Character(this.$avatar, this.sc.id) : null;
      if (!this.anime) this.$avatar.textContent = CAST[this.sc.id] || "🙂";
      if (window.RTAnime && RTAnime.mountEnv) RTAnime.mountEnv(this.root.querySelector(".vp-scene"), this.sc.id);
      this.$video = this.root.querySelector("#vp-video");
      this.$mood = this.root.querySelector("#vp-mood");
      this.$speaker = this.root.querySelector("#vp-speaker");
      this.$line = this.root.querySelector("#vp-line");
      this.$linePt = this.root.querySelector("#vp-line-pt");
      this.$choices = this.root.querySelector("#choice-area");
      this.$rack = this.root.querySelector("#clip-rack");

      setTimeout(() => {
        if (this.destroyed) return;
        const acc = window.ACCENTS && window.ACCENTS[window.RT_ACCENT];
        const v = speech.pick();
        const noteEl = this.root.querySelector("#voice-note");
        if (!noteEl || !acc || !v) return;
        const isNeural = /natural|online|google|neural|premium/i.test(v.name);
        const langOk = acc.voices.some(l => v.lang.toLowerCase().startsWith(l.slice(0, 5).toLowerCase()));
        if (langOk && isNeural) {
          noteEl.innerHTML = (isPT() ? "🎧 voz neural: " : "🎧 neural voice: ") + v.name.replace(/Microsoft |Online |\(Natural\)/g, "").trim();
        } else if (!langOk || !isNeural) {
          noteEl.innerHTML += isPT()
            ? ` · 💡 para vozes realistas com sotaque ${acc.name}, abra este site no <b>Microsoft Edge</b> (vozes neurais grátis nos 6 sotaques)`
            : ` · 💡 for realistic ${acc.name} voices, open this site in <b>Microsoft Edge</b> (free neural voices in all 6 accents)`;
        }
      }, 700);
    }

    // pt = optional Portuguese subtitle shown under the English caption
    playLine({ speaker, text, isYou, mood, pt }, cb) {
      speech.stop();
      this.timers.forEach(clearTimeout);
      this.timers = [];

      this.$speaker.textContent = speaker;
      this.$speaker.className = "vp-speaker" + (isYou ? " you" : "");
      this.$line.textContent = "";
      this.$linePt.textContent = "";

      if (mood && !isYou) {
        if (this.anime) { this.anime.setVisible(true); this.anime.setMood(mood); }
        else this.$avatar.textContent = CAST[this.sc.id] || MOOD_AVATARS[mood] || "🙂";
        this.$mood.textContent = (MOOD_AVATARS[mood] || "") + " " + moodLabel(mood);
        this.$mood.style.display = "block";
      } else if (isYou) {
        this.$mood.style.display = "none";
      } else if (!mood && !isYou && this.anime) {
        // narrator beat — the character steps out of frame
        this.anime.setVisible(false);
      }
      if (this.anime) this.anime.setTalking(!isYou);
      this.$avatar.classList.add("talking");

      const words = text.split(/\s+/);
      let i = 0;
      const reveal = () => {
        i++;
        this.$line.textContent = words.slice(0, i).join(" ");
        if (i < words.length) this.later(reveal, WORD_MS);
      };
      reveal();

      // the PT subtitle fades in shortly after the line starts
      if (isPT() && pt) this.later(() => { this.$linePt.textContent = pt; }, Math.min(900, words.length * WORD_MS));

      let captionDone = false, voiceDone = false, called = false;
      const maybeDone = () => {
        if (called || !(captionDone && voiceDone) || this.destroyed) return;
        called = true;
        this.$avatar.classList.remove("talking");
        if (this.anime) this.anime.setTalking(false);
        cb && cb();
      };
      this.later(() => { captionDone = true; maybeDone(); }, words.length * WORD_MS + 250);
      speech.speak(text, { isYou, character: isYou ? null : this.sc.id, onEnd: () => { voiceDone = true; maybeDone(); } });
      if (!speech.enabled || !window.speechSynthesis) voiceDone = true;
    }

    // ================= tap & speak modes =================
    goto(id) {
      const node = this.scene.nodes[id];
      if (!node) { console.error("Missing node:", id); return; }
      this.node = node;
      this.nodeId = id;
      this.$choices.innerHTML = "";

      if (node.video) {
        this.$video.src = node.video;
        this.$video.style.display = "block";
        this.$video.play().catch(() => {});
      } else {
        this.$video.style.display = "none";
      }

      const isNarr = node.who === "narrator";
      const ptn = this.ptNode(id);
      this.playLine({
        speaker: isNarr ? "· scene ·" : T(node.name),
        text: T(node.line),
        isYou: false,
        mood: isNarr ? null : (node.mood || "friendly"),
        pt: ptn && ptn.line
      }, () => this.afterLine(node));
    }

    afterLine(node) {
      const ptn = this.ptNode(this.nodeId);
      if (node.note) {
        const tip = document.createElement("div");
        tip.className = "tip-note";
        const en = T(node.note);
        if (isPT() && ptn && ptn.note) {
          tip.innerHTML = `${ptn.note}<span class="sub-en">${en}</span>`;
        } else {
          tip.textContent = en;
        }
        this.$choices.appendChild(tip);
      }
      if (node.end) return this.showEnd(node);
      if (node.choices && node.choices.length) {
        return this.mode === "speak" ? this.showSpeakPrompt(node) : this.showChoices(node);
      }
      if (node.next) {
        const btn = document.createElement("button");
        btn.className = "btn continue-btn";
        btn.textContent = L("cont");
        btn.onclick = () => this.goto(node.next);
        this.$choices.appendChild(btn);
      }
    }

    choicePt(idx) {
      const ptn = this.ptNode(this.nodeId);
      return (ptn && ptn.choices && ptn.choices[idx]) || null;
    }
    choiceFbPt(idx) {
      const ptn = this.ptNode(this.nodeId);
      return (ptn && ptn.fbs && ptn.fbs[idx]) || null;
    }

    showChoices(node) {
      const prompt = document.createElement("div");
      prompt.className = "choice-prompt";
      prompt.textContent = L("whatSay");
      this.$choices.appendChild(prompt);

      node.choices.forEach((ch, idx) => {
        const pt = isPT() && this.choicePt(idx);
        const b = document.createElement("button");
        b.className = "choice-btn";
        b.innerHTML = `<span class="choice-letter">${"ABC"[idx] || "•"}</span><span>${T(ch.say)}${pt ? `<span class="say-pt">${pt}</span>` : ""}</span>`;
        b.onclick = () => this.pick(node, ch, idx);
        this.$choices.appendChild(b);
      });
    }

    // ---------- speak mode ----------
    showSpeakPrompt(node) {
      this.$choices.querySelector(".speak-box")?.remove();
      const box = document.createElement("div");
      box.className = "speak-box";
      box.innerHTML = `
        <div class="choice-prompt">${L("speakPrompt")}</div>
        ${node.choices.map((ch, i) => {
          const pt = isPT() && this.choicePt(i);
          return `
          <div class="speak-option" data-i="${i}">
            <span class="choice-letter">${"ABC"[i] || "•"}</span>
            <span>${T(ch.say)}${pt ? `<span class="say-pt">${pt}</span>` : ""}</span>
          </div>`;
        }).join("")}
        <div class="mic-row">
          <button class="mic-btn" id="mic-btn" title="${L("micHint")}">🎙️</button>
          <div class="mic-hint" id="mic-hint">${L("micHint")}</div>
        </div>`;
      this.$choices.appendChild(box);

      box.querySelectorAll(".speak-option").forEach(el => {
        el.onclick = () => { recognition.stop(); this.pick(node, node.choices[+el.dataset.i], +el.dataset.i); };
      });

      const micBtn = box.querySelector("#mic-btn");
      const hint = box.querySelector("#mic-hint");

      if (!recognition.supported) {
        micBtn.disabled = true;
        micBtn.style.opacity = ".4";
        hint.textContent = L("micUnsupported");
        return;
      }

      micBtn.onclick = () => {
        micBtn.classList.add("listening");
        hint.textContent = L("micListening");
        recognition.listen({
          onResult: (alts) => {
            if (this.destroyed) return;
            micBtn.classList.remove("listening");
            this.handleSpeech(node, alts, box);
          },
          onError: (err) => {
            if (this.destroyed) return;
            micBtn.classList.remove("listening");
            hint.textContent = err === "not-allowed" ? L("micBlocked")
              : err === "no-speech" ? L("micNoSpeech") : L("micErr");
          }
        });
      };
    }

    handleSpeech(node, alts, box) {
      let best = { score: 0, choice: null, idx: -1, heard: alts[0] || "" };
      for (const alt of alts) {
        node.choices.forEach((ch, idx) => {
          const s = similarity(alt, T(ch.say));
          if (s > best.score) best = { score: s, choice: ch, idx, heard: alt };
        });
      }
      const hint = box.querySelector("#mic-hint");
      if (best.choice && best.score >= MATCH_THRESHOLD) {
        const pct = Math.round(best.score * 100);
        const heard = document.createElement("div");
        heard.className = "heard-box match";
        heard.innerHTML = `${L("weHeard")} <em>"${best.heard}"</em> — <b>${pct}% ${L("match")}</b> ✓`;
        box.appendChild(heard);
        recognition.stop();
        this.later(() => this.pick(node, best.choice, best.idx, { spoken: true, heard: best.heard, pct }), 900);
      } else {
        const heard = document.createElement("div");
        heard.className = "heard-box miss";
        heard.innerHTML = best.heard
          ? `${L("weHeard")} <em>"${best.heard}"</em> — ${L("noMatch")}`
          : L("noMatchEmpty");
        box.appendChild(heard);
        hint.textContent = "";
        this.playLine({
          speaker: T(node.name) || "Them", mood: "confused",
          text: "Sorry — what was that?", isYou: false,
          pt: isPT() ? "Desculpa — o que foi que você disse?" : null
        }, () => {
          if (this.destroyed) return;
          box.querySelector("#mic-hint").textContent = L("tryAgainMic");
        });
      }
    }

    pick(node, ch, idx, spoken) {
      if (idx === undefined || idx < 0) idx = node.choices.indexOf(ch);
      const say = T(ch.say), fbText = T(ch.fb);
      const fbPt = isPT() && this.choiceFbPt(idx);
      this.counts[ch.quality] = (this.counts[ch.quality] || 0) + 1;
      if (ch.quality !== "natural") this.missed.push({ said: say, fb: fbPt || fbText });

      this.$choices.querySelectorAll(".choice-btn").forEach(b => {
        b.disabled = true;
        if (!b.textContent.includes(say)) b.style.opacity = ".35";
      });
      this.$choices.querySelectorAll(".speak-option").forEach(el => {
        el.style.pointerEvents = "none";
        if (!el.textContent.includes(say)) el.style.opacity = ".35";
      });
      const micRow = this.$choices.querySelector(".mic-row");
      if (micRow) micRow.style.display = "none";

      this.playLine({ speaker: isPT() ? "Você" : "You", text: say, isYou: true, pt: isPT() && this.choicePt(idx) }, () => {
        // the character reacts to what you just said — 90s anime style
        if (this.anime) this.anime.react(ch.quality);
        if (ch.quality === "wrong") {
          const vp = this.root.querySelector(".viewport");
          if (vp) { vp.classList.remove("vp-shake"); void vp.offsetWidth; vp.classList.add("vp-shake"); }
        }
        const fb = document.createElement("div");
        fb.className = `feedback ${ch.quality === "natural" ? "natural" : ch.quality === "awkward" ? "awkward" : "wrong"}`;
        const spokeNote = spoken && spoken.spoken ? `<div class="spoke-note">${L("spokeNote", { pct: spoken.pct })}</div>` : "";
        const body = fbPt ? `${fbPt}<span class="sub-en">${fbText}</span>` : fbText;
        fb.innerHTML = `<span class="fb-tag">${qualityTag(ch.quality)}</span>${body}${spokeNote}`;
        this.$choices.appendChild(fb);

        const btn = document.createElement("button");
        btn.className = "btn continue-btn";
        btn.textContent = L("cont");
        btn.onclick = () => this.goto(ch.next);
        this.$choices.appendChild(btn);
        btn.scrollIntoView({ behavior: "smooth", block: "nearest" });
      });
    }

    showEnd(node) {
      const c = this.counts;
      const total = c.natural + c.awkward + c.wrong;
      const wrap = document.createElement("div");
      wrap.className = "end-screen card";
      wrap.style.marginTop = "16px";

      let verdict;
      if (c.wrong === 0 && c.awkward === 0) verdict = L("vFlawless");
      else if (c.wrong === 0) verdict = L("vSolid");
      else if (c.wrong <= 2) verdict = L("vSurvived");
      else verdict = L("vChaotic");
      if (this.mode === "speak") verdict += " " + L("vSpoke");

      const confettiColors = ["#f2d060", "#f4587a", "#7ac0c0", "#fff", "#8aa06a"];
      wrap.innerHTML = `
        <div class="confetti">${Array.from({ length: 16 }, (_, i) =>
          `<span style="left:${(i * 6.3 + 3) % 100}%;background:${confettiColors[i % 5]};animation-delay:${(i % 7) * .18}s"></span>`).join("")}</div>
        <h3 style="font-size:19px">${L("sceneComplete")} — ${this.sc.title} ${this.sc.emoji}</h3>
        <p style="color:var(--ink-soft);margin-top:4px">${verdict}</p>
        <div class="end-counts">
          <div class="end-count natural"><div class="n">${c.natural}</div>${L("natural")}</div>
          <div class="end-count awkward"><div class="n">${c.awkward}</div>${L("awkward")}</div>
          <div class="end-count wrong"><div class="n">${c.wrong}</div>${L("wrongs")}</div>
        </div>
        ${this.missed.length ? `<h4 style="margin:14px 0 4px">${L("reviewSlips")}</h4>` +
          this.missed.map(m => `<div class="review-item"><div class="review-said"><span class="rs-label">${L("youSaid")}</span> "${m.said}"</div><div class="review-fix">${m.fb}</div></div>`).join("") : ""}
        <div style="margin-top:18px;display:flex;gap:10px;flex-wrap:wrap">
          <button class="btn" id="replay-btn">${L("replay")}</button>
          <a class="btn ghost" href="#/home">${L("backHome")}</a>
        </div>`;
      this.$choices.appendChild(wrap);
      wrap.querySelector("#replay-btn").onclick = () => {
        this.destroy();
        new ScenePlayer(this.root, this.sc, { mode: this.mode, onComplete: this.onComplete });
      };
      this.onComplete && this.onComplete({ counts: { ...c }, total });
    }

    // ================= watch (POV) mode =================
    buildPath() {
      const steps = [];
      const seen = new Set();
      let id = this.scene.start;
      while (id && !seen.has(id)) {
        seen.add(id);
        const node = this.scene.nodes[id];
        if (!node) break;
        const ptn = this.ptNode(id);
        steps.push({ kind: node.who === "narrator" ? "narrator" : "them", node, pt: ptn && ptn.line });
        if (node.end) break;
        if (node.choices && node.choices.length) {
          let idx = node.choices.findIndex(c => c.quality === "natural");
          if (idx < 0) idx = 0;
          const ch = node.choices[idx];
          steps.push({ kind: "you", say: T(ch.say), pt: ptn && ptn.choices && ptn.choices[idx], node });
          id = ch.next;
        } else {
          id = node.next;
        }
      }
      return steps;
    }

    renderWatchIntro() {
      this.path = this.buildPath();
      this.$choices.innerHTML = `
        <div class="watch-intro">
          <p class="page-blurb" style="margin-bottom:12px">${L("watchIntro")} <b>${this.path.length} ${L("lines")}.</b></p>
          <button class="btn" id="watch-btn">${L("watchBtn")}</button>
        </div>`;
      this.$choices.querySelector("#watch-btn").onclick = () => {
        this.$choices.innerHTML = "";
        this.playWatch(0);
      };
    }

    playWatch(i) {
      if (this.destroyed) return;
      if (i >= this.path.length) return this.watchEnd();
      const step = this.path[i];
      this.$choices.innerHTML = `<div class="watch-progress">▶ ${L("lineOf", { i: i + 1, n: this.path.length })} · <a href="#" id="watch-skip">${L("skipEnd")}</a></div>`;
      this.$choices.querySelector("#watch-skip").onclick = (e) => { e.preventDefault(); speech.stop(); this.watchEnd(); };

      this.rackHighlight(i);
      if (step.kind === "you") {
        this.playLine({ speaker: isPT() ? "Você" : "You", text: step.say, isYou: true, pt: step.pt }, () => this.later(() => this.playWatch(i + 1), 350));
      } else {
        const node = step.node;
        if (node.video) { this.$video.src = node.video; this.$video.style.display = "block"; this.$video.play().catch(() => {}); }
        else this.$video.style.display = "none";
        this.playLine({
          speaker: step.kind === "narrator" ? "· scene ·" : T(node.name),
          text: T(node.line),
          isYou: false,
          mood: step.kind === "narrator" ? null : (node.mood || "friendly"),
          pt: step.pt
        }, () => this.later(() => this.playWatch(i + 1), 350));
      }
    }

    watchEnd() {
      this.$choices.innerHTML = `
        <div class="watch-intro card" style="margin-top:14px">
          <h3 style="margin-bottom:6px">${L("watchDone")}</h3>
          <p style="color:var(--ink-soft)">${L("watchDoneP")}</p>
          <div style="margin-top:14px;display:flex;gap:10px;flex-wrap:wrap">
            <a class="btn" href="#/scenario/${this.sc.id}/play">${L("playTap")}</a>
            <a class="btn ghost" href="#/scenario/${this.sc.id}/speak">${L("speakLoud")}</a>
            <button class="btn ghost" id="rewatch-btn">${L("rewatch")}</button>
          </div>
        </div>`;
      this.$choices.querySelector("#rewatch-btn").onclick = () => { this.$choices.innerHTML = ""; this.playWatch(0); };
      this.rackHighlight(-1);
    }

    renderClipRack() {
      const [c1, c2] = this.sc.bg || ["#333", "#666"];
      this.$rack.innerHTML = `
        <div class="section-title" style="margin-top:26px">${L("clipRack")}</div>
        <div class="clip-grid">
          ${this.path.map((step, i) => {
            const isYou = step.kind === "you";
            const text = isYou ? step.say : T(step.node.line);
            const speaker = isYou ? (isPT() ? "Você (POV)" : "You (POV)") : step.kind === "narrator" ? (isPT() ? "Cena" : "Scene") : T(step.node.name);
            const hasVideo = !isYou && step.node.video;
            return `
              <div class="clip-card" data-i="${i}">
                <div class="clip-thumb" style="background:linear-gradient(135deg, ${c2}, ${c1})">
                  <span>${hasVideo ? "🎞️" : isYou ? "🕶️" : MOOD_AVATARS[step.node.mood] || "🙂"}</span>
                </div>
                <div class="clip-meta">
                  <div class="clip-speaker">${speaker}</div>
                  <div class="clip-text">${text.length > 64 ? text.slice(0, 64) + "…" : text}</div>
                  <span class="chip ${hasVideo ? "" : "gold"}" style="margin-top:5px">${hasVideo ? L("footageReady") : L("awaitingFootage")}</span>
                </div>
              </div>`;
          }).join("")}
        </div>
        <p class="swap-note" style="text-align:left;margin-top:10px">${L("rackNote")}</p>`;
    }

    rackHighlight(activeIdx) {
      this.$rack.querySelectorAll(".clip-card").forEach(el => {
        el.classList.toggle("playing", +el.dataset.i === activeIdx);
      });
    }
  }

  window.RealTalkPlayer = { ScenePlayer, speech, recognition, similarity };
})();

</script>
<script>
// RealTalk — motion layer: reveal-on-scroll with stagger + count-up stats.
// Called after each route render. Respects prefers-reduced-motion.
(function () {
  const reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  let observer = null;
  function getObserver() {
    if (observer) return observer;
    observer = new IntersectionObserver((entries) => {
      entries.forEach(e => {
        if (e.isIntersecting) {
          e.target.classList.add("in");
          observer.unobserve(e.target);
        }
      });
    }, { threshold: 0.08, rootMargin: "0px 0px -30px 0px" });
    return observer;
  }

  function countUp(el) {
    const raw = el.textContent.trim();
    const m = raw.match(/^(\d+)(.*)$/);
    if (!m) return;
    const target = parseInt(m[1], 10);
    const suffix = m[2] || "";
    if (target === 0) return;
    const dur = 700;
    const t0 = performance.now();
    const tick = (t) => {
      const p = Math.min(1, (t - t0) / dur);
      const eased = 1 - Math.pow(1 - p, 3);
      el.textContent = Math.round(target * eased) + suffix;
      if (p < 1) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }

  function enhance(root) {
    if (!root || reduced) return;
    // staggered reveals for cards and section titles
    const targets = root.querySelectorAll(".card, .section-title, .lesson-list > .card");
    let groupIdx = 0;
    let lastParent = null;
    targets.forEach(el => {
      if (el.classList.contains("reveal")) return;
      if (el.parentElement !== lastParent) { groupIdx = 0; lastParent = el.parentElement; }
      el.classList.add("reveal");
      el.style.setProperty("--reveal-delay", Math.min(groupIdx * 0.07, 0.42) + "s");
      groupIdx++;
      getObserver().observe(el);
    });
    // count-up stats
    root.querySelectorAll(".stat-num").forEach(countUp);
  }

  window.RTFX = { enhance };
})();

</script>
