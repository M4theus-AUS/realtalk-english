<!DOCTYPE html>
<html lang="en" class="ui-mobile">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f4587a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>RealTalk English — Mobile</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
</head>
<body>
<style>
/* ============ RealTalk English — soft playful design system ============
   Reference: friendly learning-app style — airy pastel grounds, white rounded
   cards, one bold colored hero panel, pill buttons, floating deco dots.
   Country identity lives in soft tints (never harsh solids in the chrome).
   Semantic colors constant: green=natural, amber=awkward, coral=mistake. */

:root {
  --bg: #f2f5ef;
  --panel: #fffdf9;
  --ink: #332b3a;            /* warm plum-tinted "black" — never pure */
  --ink-soft: #635a6b;
  --ink-faint: #928a99;
  --line: #e9e4ef;

  --green: #2f8f6b;           /* country accent (bright) */
  --green-deep: #14483a;      /* country accent (deep, for text) */
  --green-dark: #0f3229;      /* darkest — player chrome */
  --green-wash: #e2f1ea;      /* country accent (soft tint) */

  --cta: #f4587a;             /* playful pink CTA, constant */
  --cta-deep: #d63e63;

  --gold: #f0a52e;
  --gold-wash: #fdf1dc;

  --coral: #e05a3a;
  --coral-wash: #fde9e2;

  --wrong-text: #c04326;
  --cream-text: #ffffff;

  --dot1: rgba(244, 88, 122, .55);
  --dot2: rgba(240, 165, 46, .55);
  --dot3: rgba(47, 143, 107, .45);

  --flag-strip: linear-gradient(90deg, #2f8f6b 0 50%, #f0a52e 50%);

  --radius: 22px;
  --radius-sm: 14px;
  --shadow: 0 2px 6px rgba(60, 56, 80, .04), 0 12px 28px rgba(60, 56, 80, .07);
  --font: "Segoe UI Variable Text", "Segoe UI", -apple-system, "Helvetica Neue", Arial, sans-serif;
  --font-display: "Baloo 2", "Segoe UI", sans-serif;
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
}

/* ============ Country tints (data-accent on <html>) ============ */
html[data-accent="us"] {
  --bg: #edeffb;
  --green: #6d7ff2; --green-deep: #3b49b0; --green-dark: #232c66; --green-wash: #e6e9fd;
  --dot3: rgba(109, 127, 242, .5);
  --flag-strip: linear-gradient(90deg, #d55a6b 0 33.3%, #f4f2fb 33.3% 66.6%, #6d7ff2 66.6%);
}
html[data-accent="uk"] {
  --bg: #f8eff1;
  --green: #b0526a; --green-deep: #7d2436; --green-dark: #40121e; --green-wash: #f6e3e8;
  --dot3: rgba(176, 82, 106, .5);
  --flag-strip: linear-gradient(90deg, #5a6bc0 0 33.3%, #f8f5fb 33.3% 66.6%, #d55a6b 66.6%);
}
html[data-accent="ca"] {
  --bg: #faf0ee;
  --green: #d95762; --green-deep: #99303c; --green-dark: #4d181e; --green-wash: #fae3e5;
  --dot3: rgba(217, 87, 98, .5);
  --flag-strip: linear-gradient(90deg, #d95762 0 25%, #faf5f2 25% 75%, #d95762 75%);
}
html[data-accent="ie"] {
  --bg: #edf6f0;
  --green: #2fae74; --green-deep: #0e5a40; --green-dark: #093524; --green-wash: #def2e8;
  --dot3: rgba(255, 136, 62, .5);
  --flag-strip: linear-gradient(90deg, #2fae74 0 33.3%, #f4f8f2 33.3% 66.6%, #ff883e 66.6%);
}
html[data-accent="sco"] {
  --bg: #f0f1fb;
  --green: #7381d9; --green-deep: #3d4fa8; --green-dark: #1d2657; --green-wash: #e8eafa;
  --dot3: rgba(115, 129, 217, .5);
  --flag-strip: linear-gradient(90deg, #5a7fd9 0 40%, #f4f4fb 40% 60%, #5a7fd9 60%);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--ink);
  line-height: 1.6;
  font-size: 16.5px;
  transition: background .5s;
}
/* floating deco dots, like the reference */
body::before {
  content: "";
  position: fixed; inset: 0; z-index: 0;
  pointer-events: none;
  background-image:
    radial-gradient(circle 5px at 12% 18%, var(--dot1) 100%, transparent),
    radial-gradient(circle 4px at 88% 12%, var(--dot2) 100%, transparent),
    radial-gradient(circle 6px at 94% 55%, var(--dot3) 100%, transparent),
    radial-gradient(circle 4px at 6% 72%, var(--dot2) 100%, transparent),
    radial-gradient(circle 5px at 78% 88%, var(--dot1) 100%, transparent);
}
.app, .mobile-nav { position: relative; z-index: 1; }
button { font-family: inherit; cursor: pointer; }
a { color: var(--green-deep); }
:focus-visible {
  outline: 2.5px solid var(--green);
  outline-offset: 2px;
  border-radius: 6px;
}
::selection { background: color-mix(in srgb, var(--green) 25%, transparent); }

/* ============ Layout ============ */
.app { display: flex; min-height: 100vh; }

.sidebar {
  width: 252px;
  flex-shrink: 0;
  background: var(--panel);
  border-right: 1px solid var(--line);
  color: var(--ink);
  display: flex;
  flex-direction: column;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
  scrollbar-width: thin;
}

.brand {
  display: flex; align-items: center; gap: 10px;
  padding: 22px 18px 12px;
}
.brand-mark { font-size: 27px; }
.brand-name { display: block; font-weight: 700; font-size: 21px; letter-spacing: .2px; font-family: var(--font-display); color: var(--ink); line-height: 1.1; }
.brand-sub { display: block; font-size: 10.5px; letter-spacing: 2.2px; text-transform: uppercase; color: var(--green); font-weight: 700; }

.nav { flex: 1; padding: 4px 12px 16px; }
.nav-label {
  font-size: 10.5px; letter-spacing: 1.8px; text-transform: uppercase;
  color: var(--ink-faint); font-weight: 700; padding: 16px 10px 6px;
}
.nav-label.sub { padding-top: 12px; color: var(--green-deep); font-size: 10px; }
.nav-item {
  display: flex; align-items: center; gap: 9px;
  padding: 8px 11px;
  border-radius: 999px;
  color: var(--ink-soft);
  text-decoration: none;
  font-size: 14px;
  margin-bottom: 2px;
  transition: background .18s, color .18s, transform .18s;
}
.nav-item:hover { background: var(--green-wash); color: var(--green-deep); transform: translateX(3px); }
.nav-item.active { background: var(--green-wash); color: var(--green-deep); font-weight: 700; }
.nav-emoji { width: 20px; text-align: center; font-size: 15px; flex-shrink: 0; }
.nav-text { display: flex; flex-direction: column; line-height: 1.2; }
.nav-en { font-size: 10.5px; font-style: italic; font-weight: 400; color: var(--ink-faint); }
.nav-item.active .nav-en, .nav-item:hover .nav-en { color: color-mix(in srgb, var(--green-deep) 65%, transparent); }
.nav-done { margin-left: auto; font-size: 11px; color: var(--green); font-weight: 700; }

.sidebar-foot { padding: 12px 16px; border-top: 1px solid var(--line); }
.sound-toggle {
  width: 100%;
  background: var(--green-wash); color: var(--green-deep);
  border: none;
  border-radius: 999px;
  padding: 8px 10px; font-size: 13px; font-weight: 600;
  transition: filter .18s;
}
.sound-toggle:hover { filter: brightness(.97); }

.content { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.main { min-width: 0; padding: 26px 44px 90px; max-width: 1080px; width: 100%; }

/* ============ Accent topbar — flags on soft washes, never solid ============ */
.topbar {
  position: sticky; top: 0; z-index: 40;
  display: flex; align-items: center; gap: 7px; flex-wrap: wrap;
  padding: 15px 44px 12px;
  background: color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid color-mix(in srgb, var(--line) 60%, transparent);
}
.topbar::before {
  content: "";
  position: absolute; top: 0; left: 0; right: 0; height: 4px;
  background: var(--flag-strip);
  opacity: .8;
}
.accent-label {
  font-size: 11px; letter-spacing: 1.8px; text-transform: uppercase;
  color: var(--ink-faint); font-weight: 700; margin-right: 4px;
}
.accent-btn {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 74px; min-height: 32px;
  background-image: linear-gradient(rgba(255, 253, 249, .82), rgba(255, 253, 249, .82)), var(--flagimg, none);
  background-size: cover, cover;
  background-position: center, center;
  border: 1.5px solid rgba(51, 40, 58, .12);
  border-radius: 999px;
  padding: 6px 14px;
  font-size: 12.5px; font-weight: 700; color: var(--ink-soft);
  transition: transform .1s linear, border-color .1s linear;
  overflow: hidden;
}
.accent-btn:hover { transform: translateY(-1px); border-color: var(--green); }
.accent-btn.active {
  background-image: linear-gradient(rgba(255, 253, 249, .22), rgba(255, 253, 249, .22)), var(--flagimg, none);
  border-color: var(--green-deep);
  border-width: 2px;
  color: #fff;
  text-shadow: 0 1px 3px rgba(20, 14, 28, .75), 0 0 6px rgba(20, 14, 28, .4);
}
.accent-flag { font-size: 15px; }
.accent-tagline {
  margin-left: auto;
  font-size: 12px; color: var(--ink-faint); font-style: italic;
}
.lang-switch {
  display: inline-flex; gap: 3px; margin-left: 10px;
  background: rgba(255,255,255,.55);
  border-radius: 999px; padding: 3px;
}
.lang-btn {
  border: none; background: transparent;
  border-radius: 999px; padding: 4px 11px;
  font-size: 12.5px; font-weight: 700; color: var(--ink-soft);
  transition: background .18s, color .18s;
}
.lang-btn.active { background: var(--green-wash); color: var(--green-deep); }

/* ============ Shared elements ============ */
.page-head { margin-bottom: 26px; }
.page-kicker {
  font-size: 11px; letter-spacing: 2.4px; text-transform: uppercase;
  color: var(--green); font-weight: 700; margin-bottom: 6px;
}
.page-title { font-size: 34px; font-weight: 700; letter-spacing: -.4px; font-family: var(--font-display); line-height: 1.02; text-wrap: balance; }
.page-title-pt { font-size: 15px; font-style: italic; color: var(--ink-faint); margin-top: 2px; }
.page-blurb { color: var(--ink-soft); margin-top: 6px; max-width: 62ch; }

.card {
  background: var(--panel);
  border: 1px solid color-mix(in srgb, var(--line) 70%, transparent);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 20px 22px;
}

.grid { display: grid; gap: 14px; }
.grid-2 { grid-template-columns: repeat(2, 1fr); }
.grid-3 { grid-template-columns: repeat(3, 1fr); }
.grid-4 { grid-template-columns: repeat(4, 1fr); }

.chip {
  display: inline-block;
  font-size: 12px; font-weight: 700;
  padding: 3px 11px;
  border-radius: 999px;
  background: var(--green-wash); color: var(--green-deep);
}
.chip.gold { background: var(--gold-wash); color: #9c6410; }
.chip.coral { background: var(--coral-wash); color: #a33a1e; }

/* chunky game-button: solid face + darker 3D bottom edge that compresses on press */
.btn {
  position: relative;
  display: inline-flex; align-items: center; gap: 8px;
  background: var(--green);
  color: #fff;
  border: none; border-radius: 999px;
  padding: 11px 24px;
  font-size: 15px; font-weight: 700;
  font-family: var(--font-display);
  text-decoration: none;
  box-shadow: 0 4px 0 color-mix(in srgb, var(--green) 62%, #201828);
  transition: transform .1s linear, box-shadow .1s linear, filter .1s linear;
}
.btn:hover { filter: brightness(1.06); }
.btn:active { transform: translateY(4px); box-shadow: 0 0 0 color-mix(in srgb, var(--green) 62%, #201828); }
.btn.ghost {
  background: transparent; color: var(--green-deep);
  box-shadow: none;
  border: 2px solid var(--green);
  transition: background .1s linear, color .1s linear;
}
.btn.ghost:hover { background: var(--green); color: #fff; filter: none; }
.btn.ghost:active { transform: translateY(2px); }
.btn.cta {
  background: var(--cta);
  box-shadow: 0 4px 0 #b23955;
}
.btn.cta:active { transform: translateY(4px); box-shadow: 0 0 0 #b23955; }

/* ============ Reveal-on-scroll motion ============ */
.reveal { opacity: 0; transform: translateY(18px); }
.reveal.in {
  opacity: 1; transform: none;
  transition: opacity .6s var(--ease-out), transform .6s var(--ease-out);
  transition-delay: var(--reveal-delay, 0s);
}

/* ============ Home / hero — the one bold colored panel ============ */
.hero {
  background: var(--green);
  background-size: cover, cover;
  background-position: center, center right;
  color: #fff;
  border-radius: 26px;
  padding: 34px 36px 30px;
  margin-bottom: 26px;
  position: relative;
  overflow: hidden;
  box-shadow: 0 18px 44px color-mix(in srgb, var(--green) 35%, transparent);
  transition: background .5s;
}
.hero h1, .hero p { text-shadow: 0 1px 8px rgba(20, 14, 28, .3); }
.hero::before {
  content: "";
  position: absolute; inset: -40%;
  background:
    radial-gradient(circle at 30% 30%, rgba(255, 255, 255, .16), transparent 42%),
    radial-gradient(circle at 78% 72%, rgba(255, 255, 255, .10), transparent 40%);
  animation: aurora 14s ease-in-out infinite alternate;
  z-index: 0;
}
@keyframes aurora {
  from { transform: translate(-4%, -3%) rotate(0deg) scale(1); }
  to   { transform: translate(4%, 3%) rotate(6deg) scale(1.08); }
}
.hero h1 {
  font-size: 36px; margin-bottom: 8px;
  font-family: var(--font-display); font-weight: 700; line-height: 1.1;
  position: relative; z-index: 2;
  animation: heroRise .8s var(--ease-out) both;
}
.hero p { color: rgba(255, 255, 255, .88); max-width: 58ch; position: relative; z-index: 2; animation: heroRise .8s var(--ease-out) .12s both; }
.hero .btn { margin-top: 18px; background: var(--cta); color: #fff; position: relative; z-index: 2; animation: heroRise .8s var(--ease-out) .22s both; box-shadow: 0 4px 0 #b23955; }
.hero .btn:active { transform: translateY(4px); box-shadow: 0 0 0 #b23955; }
/* feastie-style rotated sticker badge */
.hero-sticker {
  position: absolute; right: 118px; top: 26px; z-index: 2;
  background: var(--gold); color: #3a2a08;
  font-family: var(--font-display); font-weight: 800; font-size: 13px;
  line-height: 1.05; text-align: center;
  padding: 14px 12px;
  border-radius: 50% 50% 46% 54% / 52% 48% 52% 48%;
  transform: rotate(-9deg);
  box-shadow: 0 4px 0 rgba(120, 80, 10, .35);
  animation: floaty 6.5s ease-in-out infinite;
}
.hero h1 { font-size: 40px; }
/* marquee ticker — rhythm divider */
.ticker {
  overflow: hidden;
  background: var(--green);
  color: #fff;
  border-radius: 999px;
  margin: 0 0 24px;
  padding: 8px 0;
  font-family: var(--font-display); font-weight: 700; font-size: 14px;
  letter-spacing: 1px;
  white-space: nowrap;
}
.ticker-track {
  display: inline-block;
  animation: ticker-roll 22s linear infinite;
}
.ticker:hover .ticker-track { animation-play-state: paused; }
@keyframes ticker-roll { from { transform: translateX(0) } to { transform: translateX(-50%) } }
@keyframes heroRise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
.hero-emoji {
  position: absolute; right: 30px; top: 20px; font-size: 78px;
  filter: drop-shadow(0 10px 18px rgba(0,0,0,.25));
  z-index: 2;
  animation: floaty 5.5s ease-in-out infinite;
}
@keyframes floaty { 0%, 100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-10px) rotate(3deg); } }
.hero-postcards {
  margin-top: 20px; font-size: 21px; letter-spacing: 12px; opacity: .9;
  position: relative; z-index: 2;
  animation: heroRise .8s var(--ease-out) .3s both;
}
.hero::after {
  content: "";
  position: absolute; right: -10px; bottom: -28px;
  font-family: var(--font-display); font-weight: 800;
  font-size: 100px; letter-spacing: 6px;
  color: rgba(255, 255, 255, .08);
  pointer-events: none; white-space: nowrap; z-index: 1;
}
html[data-accent="au"] .hero::after { content: "AUSTRALIA"; }
html[data-accent="us"] .hero::after { content: "AMERICA"; }
html[data-accent="uk"] .hero::after { content: "BRITAIN"; }
html[data-accent="ca"] .hero::after { content: "CANADA"; }
html[data-accent="ie"] .hero::after { content: "IRELAND"; }
html[data-accent="sco"] .hero::after { content: "SCOTLAND"; }

/* stat pills — app-category convention */
.stat-row { margin-bottom: 30px; }
.stat {
  display: flex; align-items: center; gap: 12px;
  text-align: left;
  border-radius: 999px;
  padding: 12px 20px !important;
}
.stat-emoji { font-size: 24px; flex-shrink: 0; }
.stat-num {
  font-size: 26px; font-weight: 700; color: var(--green-deep);
  font-family: var(--font-display);
  font-variant-numeric: tabular-nums;
  line-height: 1;
}
.stat-cap { font-size: 10.5px; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 1.6px; font-weight: 700; }

.scenario-card {
  display: flex; flex-direction: column; gap: 6px;
  text-decoration: none; color: var(--ink);
  transition: transform .25s var(--ease-out), box-shadow .25s;
  overflow: hidden;
  padding: 14px 0 16px;
  will-change: transform;
}
.scenario-card:hover {
  transform: translateY(-4px) scale(1.015);
  box-shadow: 0 6px 12px color-mix(in srgb, var(--green) 8%, transparent), 0 20px 40px rgba(60, 56, 80, .13);
}
.scenario-card .sc-head {
  height: 96px;
  margin: 0 16px 8px;
  border-radius: 18px;
  display: block;
  background-size: cover, cover;
  background-position: center, center;
  box-shadow: inset 0 0 0 1px rgba(51, 40, 58, .08);
  transition: transform .3s var(--ease-out);
}
.scenario-card:hover .sc-head { transform: scale(1.03); }
.scenario-card .sc-emoji { font-size: 30px; padding: 0 16px; }
.scenario-card .sc-title { font-weight: 700; font-size: 16.5px; padding: 0 16px; font-family: var(--font-display); line-height: 1.2; }
.sc-title-pt {
  display: block; font-family: var(--font);
  font-size: 12px; font-weight: 500; font-style: italic;
  color: var(--ink-faint); margin-top: 1px;
}
.scenario-card .sc-blurb { font-size: 13.5px; color: var(--ink-soft); flex: 1; padding: 0 16px; }
.scenario-card .sc-meta { display: flex; gap: 8px; align-items: center; margin-top: 4px; padding: 0 16px; }

.section-title {
  font-size: 21px; font-weight: 700; margin: 44px 0 16px;
  font-family: var(--font-display);
  line-height: 1.05;
  display: flex; align-items: center; gap: 10px;
}
.section-title::before {
  content: "";
  width: 22px; height: 6px; border-radius: 999px;
  background: linear-gradient(90deg, var(--green), var(--cta));
}

/* ============ Grammar ============ */
.lesson-list .card { margin-bottom: 12px; cursor: pointer; transition: box-shadow .2s, transform .2s; }
.lesson-list .card:hover { transform: translateX(4px); box-shadow: 0 6px 12px rgba(60,56,80,.06), 0 14px 30px rgba(60,56,80,.1); }
.lesson-row { display: flex; align-items: center; gap: 14px; }
.lesson-row .l-emoji { font-size: 24px; }
.lesson-row .l-title { font-weight: 700; font-family: var(--font-display); }
.lesson-row .l-sub { font-size: 13.5px; color: var(--ink-soft); }
.lesson-row .l-done { margin-left: auto; }

.compare-table { width: 100%; border-collapse: collapse; margin: 14px 0; font-size: 14.5px; }
.compare-table th {
  text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: 1px;
  color: var(--ink-faint); padding: 6px 10px; border-bottom: 2px solid var(--line);
}
.compare-table td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.compare-table .wrong { color: var(--wrong-text); }
.compare-table .wrong::before { content: "✗ "; }
.compare-table .right { color: var(--green-deep); font-weight: 600; }
.compare-table .right::before { content: "✓ "; }

.callout {
  border-left: 4px solid var(--gold);
  background: var(--gold-wash);
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  padding: 12px 16px;
  margin: 14px 0;
  font-size: 14px;
}
.callout.br::before { content: "🇧🇷 "; font-weight: 700; }

.lesson-body h3 { margin: 22px 0 8px; font-size: 17px; font-family: var(--font-display); }
.lesson-body p { margin-bottom: 10px; color: var(--ink-soft); }
.lesson-body p strong { color: var(--ink); }
.back-link {
  display: inline-block; margin-bottom: 16px;
  color: var(--green-deep); text-decoration: none; font-weight: 700; font-size: 14px;
}

/* ============ Exercises / quiz ============ */
.quiz-option {
  display: block; width: 100%; text-align: left;
  background: var(--panel);
  border: 1.5px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 12px 16px;
  font-size: 15px;
  color: var(--ink);
  margin-bottom: 10px;
  transition: border-color .18s, background .18s, transform .18s;
}
.quiz-option:hover:not(:disabled) { border-color: var(--green); background: var(--green-wash); transform: translateX(4px); }
.quiz-option:disabled { cursor: default; }
.quiz-option.correct { border-color: var(--green); background: var(--green-wash); font-weight: 600; }
.quiz-option.incorrect { border-color: var(--coral); background: var(--coral-wash); }

.quiz-progress { font-size: 13px; color: var(--ink-faint); margin-bottom: 8px; font-variant-numeric: tabular-nums; }
.quiz-q { font-size: 18px; font-weight: 700; margin-bottom: 16px; font-family: var(--font-display); line-height: 1.3; }
.quiz-explain {
  background: var(--green-wash); border-radius: var(--radius-sm);
  padding: 12px 16px; margin-top: 12px; font-size: 14px;
  animation: rise .3s var(--ease-out) both;
}
.quiz-explain.bad { background: var(--coral-wash); }
.quiz-score { text-align: center; padding: 30px 0; }
.quiz-score .big {
  font-size: 50px; font-weight: 700; color: var(--green-deep);
  font-family: var(--font-display); line-height: 1;
}

.progress-bar { height: 8px; background: rgba(255,255,255,.8); border-radius: 999px; overflow: hidden; margin-bottom: 18px; }
.progress-bar > div {
  height: 100%;
  background: linear-gradient(90deg, var(--green), var(--cta));
  border-radius: 999px;
  transition: width .5s var(--ease-out);
}

/* ============ Scenario page ============ */
.tab-row {
  display: inline-flex; gap: 4px; margin-bottom: 22px;
  background: rgba(255, 255, 255, .75);
  border-radius: 999px;
  padding: 5px;
  box-shadow: var(--shadow);
  flex-wrap: wrap;
}
.tab-btn {
  background: transparent; border: none;
  border-radius: 999px; padding: 8px 16px;
  font-size: 14px; font-weight: 700; color: var(--ink-soft);
  font-family: var(--font-display);
  transition: background .18s, color .18s;
}
.tab-btn:hover { background: var(--green-wash); color: var(--green-deep); }
.tab-btn.active { background: var(--green); color: #fff; box-shadow: 0 4px 12px color-mix(in srgb, var(--green) 35%, transparent); }

.phrase-row { display: flex; justify-content: space-between; gap: 14px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.phrase-row:last-child { border-bottom: none; }
.phrase-en { font-weight: 600; }
.phrase-note { color: var(--ink-soft); font-size: 13.5px; text-align: right; max-width: 46%; }

.slang-chip {
  display: inline-block; margin: 0 8px 8px 0;
  background: var(--bg); border: none;
  border-radius: 999px; padding: 7px 15px; font-size: 13.5px;
  transition: transform .18s, background .18s;
}
.slang-chip:hover { background: var(--green-wash); transform: translateY(-2px); }
.slang-chip b { color: var(--green-deep); }

/* ============ Vocab tab ============ */
.vocab-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
  gap: 10px;
}
.vocab-card {
  background: var(--panel);
  border-radius: var(--radius-sm);
  box-shadow: var(--shadow);
  padding: 13px 15px;
  transition: transform .2s var(--ease-out), box-shadow .2s;
}
.vocab-card:hover { transform: translateY(-3px); box-shadow: 0 6px 12px rgba(60,56,80,.06), 0 14px 28px rgba(60,56,80,.11); }
.vocab-en { font-weight: 700; font-family: var(--font-display); font-size: 15.5px; color: var(--green-deep); }
.vocab-pt { font-size: 13px; color: var(--ink-soft); font-style: italic; }
.vocab-ex { font-size: 12.5px; color: var(--ink-faint); margin-top: 5px; padding-top: 5px; border-top: 1px dashed var(--line); }
.vocab-ex::before { content: "💬 "; }
.vocab-say {
  float: right;
  border: none; background: var(--green-wash); color: var(--green-deep);
  width: 28px; height: 28px; border-radius: 50%;
  font-size: 13px;
  transition: transform .15s;
}
.vocab-say:hover { transform: scale(1.12); }

/* ============ Learn extras ============ */
.dialogue-line { display: flex; gap: 10px; padding: 8px 0; border-bottom: 1px dashed var(--line); }
.dialogue-line:last-child { border: none; }
.dialogue-who { flex-shrink: 0; font-weight: 700; font-size: 12px; color: var(--green-deep); text-transform: uppercase; letter-spacing: .8px; padding-top: 2px; width: 74px; }
.dialogue-text { font-size: 14.5px; }
.dialogue-pt { display: block; font-size: 12.5px; color: var(--ink-faint); font-style: italic; }
.culture-item { padding: 9px 0 9px 4px; border-bottom: 1px dashed var(--line); font-size: 14px; color: var(--ink-soft); }
.culture-item:last-child { border: none; }
.culture-item::before { content: "😲 "; }

/* ============ POV player (cinematic dark — it's a video screen) ============ */
.player-wrap { max-width: 780px; }

.viewport {
  position: relative;
  aspect-ratio: 16 / 9;
  border-radius: 20px;
  overflow: hidden;
  background: #17150f;
  box-shadow: 0 16px 44px rgba(40, 36, 30, .35);
}
.viewport video { position: absolute; inset: 0; z-index: 1; width: 100%; height: 100%; object-fit: cover; }

.vp-scene {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  transition: background 1s;
}
.vp-scene::after {
  content: "";
  position: absolute; inset: 0;
  background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.4));
  pointer-events: none;
}
.vp-avatar { font-size: 96px; filter: drop-shadow(0 8px 20px rgba(0,0,0,.45)); transition: transform .3s; position: relative; z-index: 1; }
.vp-avatar.talking { animation: bob 0.55s ease-in-out infinite alternate; }
@keyframes bob { from { transform: translateY(0) } to { transform: translateY(-7px) } }

.vp-rec {
  position: absolute; top: 14px; left: 16px; z-index: 3;
  display: flex; align-items: center; gap: 7px;
  color: #fff; font-size: 12px; font-weight: 700; letter-spacing: 1.5px;
  text-shadow: 0 1px 4px rgba(0,0,0,.6);
}
.vp-rec .dot { width: 9px; height: 9px; border-radius: 50%; background: #ff3b30; animation: blink 1.1s infinite; box-shadow: 0 0 10px rgba(255,59,48,.7); }
@keyframes blink { 0%, 60% { opacity: 1 } 61%, 100% { opacity: .25 } }

.vp-pov {
  position: absolute; top: 14px; right: 16px; z-index: 3;
  color: rgba(255,255,255,.85); font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
  text-shadow: 0 1px 4px rgba(0,0,0,.6);
}

/* the classic RPG dialogue box */
.vp-caption {
  position: absolute; left: 8px; right: 8px; bottom: 8px; z-index: 2;
  padding: 7px 26px 9px 14px;
  background: #f8f4e2;
  border: 3px solid #33283a;
  border-radius: 6px;
  box-shadow: inset 0 0 0 2px #8a94c9, 0 3px 0 rgba(20, 14, 28, .35);
  color: #2e2a30;
}
.vp-speaker {
  font-size: 15px; letter-spacing: .5px; text-transform: uppercase;
  color: #a03a2e; font-weight: 400; margin-bottom: 0;
  font-family: "VT323", "Courier New", monospace;
}
.vp-speaker.you { color: #2e6a8a; }
.vp-line {
  font-size: 21px; font-weight: 400; line-height: 1.1; min-height: 23px;
  font-family: "VT323", "Courier New", monospace;
  color: #2e2a30; text-shadow: none;
}
.vp-line-pt {
  font-size: 16px; font-style: normal; color: #8a7a68;
  line-height: 1.1; margin-top: 2px; min-height: 17px;
  font-family: "VT323", "Courier New", monospace;
  text-shadow: none;
  animation: rise .3s ease both;
}
.vp-line-pt:empty { animation: none; }
.vp-caption::after {
  content: "▼";
  position: absolute; right: 9px; bottom: 5px;
  color: #a03a2e; font-size: 13px;
  animation: cont-blink 1s steps(2) infinite;
}
@keyframes cont-blink { 0%, 49% { opacity: 1 } 50%, 100% { opacity: 0 } }
.vp-mood {
  position: absolute; top: 40px; right: 16px; z-index: 3;
  font-size: 12px; background: rgba(0,0,0,.5); color: #fff;
  padding: 4px 10px; border-radius: 999px; backdrop-filter: blur(4px);
  border: 1px solid rgba(255,255,255,.14);
}

.swap-note { font-size: 12px; color: var(--ink-faint); text-align: right; margin-top: 7px; }

/* choices */
.choice-area { margin-top: 18px; min-height: 60px; }
.choice-prompt { font-size: 13px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--ink-faint); font-weight: 700; margin-bottom: 10px; }
.choice-btn {
  display: flex; align-items: flex-start; gap: 12px;
  width: 100%; text-align: left;
  background: var(--panel);
  border: 1.5px solid transparent;
  border-radius: var(--radius-sm);
  box-shadow: var(--shadow);
  padding: 13px 16px;
  font-size: 15px;
  color: var(--ink);
  margin-bottom: 9px;
  transition: border-color .18s, background .18s, opacity .3s, transform .18s;
  animation: rise .3s var(--ease-out) both;
}
.choice-btn:nth-child(3) { animation-delay: .06s }
.choice-btn:nth-child(4) { animation-delay: .12s }
@keyframes rise { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: none } }
.choice-btn:hover:not(:disabled) { border-color: var(--green); background: var(--green-wash); transform: translateX(4px); }
.choice-btn:disabled { opacity: .45; cursor: default; }
.choice-letter {
  flex-shrink: 0;
  width: 26px; height: 26px; border-radius: 9px;
  background: var(--green-wash); color: var(--green-deep);
  font-size: 13px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  margin-top: 1px;
}
.say-pt {
  display: block;
  font-size: 12.5px; font-style: italic;
  color: var(--ink-faint);
  margin-top: 2px;
}
.sub-en {
  display: block;
  font-size: 12.5px;
  color: var(--ink-faint);
  margin-top: 5px;
  padding-top: 5px;
  border-top: 1px dashed var(--line);
}
.sub-en::before { content: "🇬🇧 "; font-size: 10px; }

.feedback {
  border-radius: var(--radius-sm);
  padding: 13px 16px;
  margin-top: 6px;
  font-size: 14.5px;
  animation: rise .3s var(--ease-out) both;
}
.feedback .fb-tag { font-weight: 700; font-size: 12.5px; text-transform: uppercase; letter-spacing: 1px; display: block; margin-bottom: 3px; }
.feedback.natural { background: var(--green-wash); }
.feedback.natural .fb-tag { color: var(--green-deep); }
.feedback.awkward { background: var(--gold-wash); }
.feedback.awkward .fb-tag { color: #9c6410; }
.feedback.wrong { background: var(--coral-wash); }
.feedback.wrong .fb-tag { color: #a33a1e; }

.tip-note {
  background: var(--gold-wash);
  border-radius: var(--radius-sm);
  padding: 11px 15px; margin-top: 10px;
  font-size: 13.5px;
  animation: rise .3s var(--ease-out) both;
}
.tip-note::before { content: "💡 "; }

.continue-btn { margin-top: 12px; }

/* ============ Speak mode ============ */
.speak-box { animation: rise .3s var(--ease-out) both; }
.speak-option {
  display: flex; align-items: flex-start; gap: 12px;
  background: var(--panel);
  border: 1.5px dashed var(--line);
  border-radius: var(--radius-sm);
  padding: 12px 16px;
  font-size: 15px;
  margin-bottom: 8px;
  cursor: pointer;
  transition: border-color .18s, background .18s, opacity .3s;
}
.speak-option:hover { border-color: var(--green); background: var(--green-wash); }
.mic-row {
  display: flex; align-items: center; gap: 14px;
  margin-top: 14px;
}
.mic-btn {
  width: 66px; height: 66px; flex-shrink: 0;
  border-radius: 50%;
  border: none;
  background: var(--cta);
  color: #fff; font-size: 26px;
  box-shadow: 0 6px 18px rgba(244, 88, 122, .4);
  transition: transform .15s, background .2s;
}
.mic-btn:hover:not(:disabled) { transform: scale(1.08); }
.mic-btn.listening {
  background: var(--coral);
  animation: micpulse 1.1s ease-in-out infinite;
}
@keyframes micpulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(224, 90, 58, .45); }
  50% { box-shadow: 0 0 0 18px rgba(224, 90, 58, 0); }
}
.mic-hint { font-size: 13.5px; color: var(--ink-soft); }
.heard-box {
  border-radius: var(--radius-sm);
  padding: 11px 15px;
  margin-top: 12px;
  font-size: 14px;
  animation: rise .3s var(--ease-out) both;
}
.heard-box.match { background: var(--green-wash); }
.heard-box.miss { background: var(--gold-wash); }
.spoke-note { margin-top: 7px; font-size: 13px; color: var(--green-deep); font-weight: 600; }

/* ============ Watch (POV) mode ============ */
.watch-intro { animation: rise .3s var(--ease-out) both; }
.watch-progress { font-size: 13px; color: var(--ink-faint); padding: 8px 2px; font-variant-numeric: tabular-nums; }
.watch-progress a { color: var(--green-deep); font-weight: 700; }
.clip-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(215px, 1fr));
  gap: 10px;
}
.clip-card {
  display: flex; gap: 10px; align-items: flex-start;
  background: var(--panel);
  border-radius: var(--radius-sm);
  box-shadow: var(--shadow);
  padding: 9px;
  transition: box-shadow .2s, transform .2s;
}
.clip-card:hover { transform: translateY(-2px); }
.clip-card.playing { box-shadow: 0 0 0 2.5px var(--green), var(--shadow); }
.clip-thumb {
  width: 58px; height: 44px; flex-shrink: 0;
  border-radius: 9px;
  display: flex; align-items: center; justify-content: center;
  font-size: 21px;
}
.clip-speaker { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--ink-faint); font-weight: 700; }
.clip-text { font-size: 12.5px; line-height: 1.35; color: var(--ink-soft); }
.clip-meta .chip { font-size: 10.5px; padding: 2px 8px; }

/* end screen — the one loud, full-color moment */
.end-screen {
  animation: rise .35s var(--ease-out) both;
  position: relative; overflow: hidden;
  background: linear-gradient(135deg, var(--green), color-mix(in srgb, var(--green) 55%, var(--cta))) !important;
  border: none !important;
  color: #fff;
}
.end-screen h3, .end-screen h4 { color: #fff; }
.end-screen > p { color: rgba(255,255,255,.9) !important; }
.end-screen .end-count { background: rgba(255,255,255,.92) !important; }
.end-screen .review-item { border-color: rgba(255,255,255,.25); }
.end-screen .review-said { color: #ffe0d5; }
.end-screen .rs-label { color: rgba(255,255,255,.7); }
.end-screen .review-fix { color: rgba(255,255,255,.85); }
.end-screen .btn { background: var(--cta); box-shadow: 0 4px 0 #b23955; }
.end-screen .btn.ghost { border-color: #fff; color: #fff; }
.end-screen .btn.ghost:hover { background: rgba(255,255,255,.2); color: #fff; }
.confetti { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.confetti span {
  position: absolute; top: -12px;
  width: 8px; height: 12px;
  animation: confetti-fall 2.6s ease-in both;
}
@keyframes confetti-fall {
  0% { transform: translateY(0) rotate(0deg); opacity: 1 }
  100% { transform: translateY(480px) rotate(540deg); opacity: 0 }
}
.end-counts { display: flex; gap: 12px; margin: 18px 0; }
.end-count {
  flex: 1; text-align: center;
  border-radius: var(--radius-sm);
  padding: 14px 8px;
}
.end-count .n { font-size: 28px; font-weight: 700; font-family: var(--font-display); line-height: 1.1; }
.end-count.natural { background: var(--green-wash); color: var(--green-deep); }
.end-count.awkward { background: var(--gold-wash); color: #9c6410; }
.end-count.wrong { background: var(--coral-wash); color: #a33a1e; }
.review-item { padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.review-item:last-child { border: none; }
.review-said { color: var(--wrong-text); }
.rs-label { color: var(--ink-faint); }
.review-fix { color: var(--ink-soft); margin-top: 2px; }

/* ============ Mobile bottom nav — floating pill dock ============ */
.mobile-nav {
  display: none;
  position: fixed; bottom: calc(10px + env(safe-area-inset-bottom)); left: 12px; right: 12px; z-index: 60;
  background: color-mix(in srgb, var(--panel) 92%, transparent);
  backdrop-filter: blur(12px);
  border-radius: 999px;
  padding: 7px 10px;
  justify-content: space-around;
  box-shadow: 0 10px 30px color-mix(in srgb, var(--green) 22%, rgba(60, 56, 80, .18));
}
.mnav-item {
  display: flex; flex-direction: column; align-items: center; gap: 1px;
  background: none; border: none;
  color: var(--ink-faint); text-decoration: none;
  font-size: 10.5px; font-weight: 700;
  padding: 6px 16px; border-radius: 999px;
  transition: color .1s linear, background .1s linear, transform .1s linear;
}
.mnav-item:active { transform: scale(.92); }
.mnav-item .mn-emoji { font-size: 19px; }
.mnav-item.active { color: #fff; background: var(--green); }

/* ============ Login / profiles ============ */
.login-screen {
  position: fixed; inset: 0; z-index: 200;
  display: flex; align-items: center; justify-content: center;
  background: var(--bg);
  padding: 20px;
}
.login-card {
  background: var(--panel);
  border-radius: 26px;
  box-shadow: 0 20px 60px rgba(60, 56, 80, .18);
  padding: 34px 36px;
  width: 100%; max-width: 420px;
  text-align: center;
  animation: rise .4s var(--ease-out) both;
}
.login-brand { font-size: 20px; margin-bottom: 14px; font-family: var(--font-display); }
.login-brand span { display: block; font-size: 10px; letter-spacing: 2.5px; text-transform: uppercase; color: var(--green); font-weight: 700; }
.login-card h2 { font-family: var(--font-display); font-size: 24px; margin-bottom: 8px; line-height: 1.2; }
.login-sub { font-size: 13.5px; color: var(--ink-soft); margin-bottom: 14px; }
.login-users { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 14px 0 8px; }
.login-user {
  display: inline-flex; align-items: center; gap: 8px;
  background: var(--green-wash); color: var(--green-deep);
  border: none; border-radius: 999px;
  padding: 9px 18px; font-size: 14.5px; font-weight: 700;
  font-family: var(--font-display);
  transition: transform .15s, filter .15s;
}
.login-user:hover { transform: translateY(-2px); filter: brightness(.97); }
.login-user span { font-size: 18px; }
.login-or { font-size: 12px; color: var(--ink-faint); margin: 10px 0 6px; }
.login-avatars { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; margin: 10px 0; }
.login-avatar {
  width: 42px; height: 42px; border-radius: 50%;
  border: 2.5px solid transparent;
  background: var(--bg);
  font-size: 21px;
  transition: transform .15s, border-color .15s;
}
.login-avatar:hover { transform: scale(1.1); }
.login-avatar.picked { border-color: var(--green); background: var(--green-wash); }
.login-input {
  width: 100%;
  border: 2px solid var(--line);
  border-radius: 999px;
  padding: 12px 20px;
  font-size: 15.5px; font-family: var(--font);
  margin: 8px 0 14px;
  outline: none;
  text-align: center;
  transition: border-color .15s;
}
.login-input:focus { border-color: var(--green); }
.login-go { width: 100%; justify-content: center; font-size: 16px; }
.profile-chip {
  display: inline-flex; align-items: center; gap: 6px;
  margin-left: 8px;
  background: rgba(255,255,255,.55);
  border: none; border-radius: 999px;
  padding: 6px 13px;
  font-size: 12.5px; font-weight: 700; color: var(--ink-soft);
  transition: background .18s, color .18s;
}
.profile-chip:hover { background: var(--coral-wash); color: #a33a1e; }
.profile-chip span { font-size: 15px; }

/* ============ Admin panel ============ */
.admin-nav { background: var(--gold-wash); color: #9c6410 !important; font-weight: 700; margin-bottom: 8px; }
.admin-label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--ink-faint); font-weight: 700; margin: 10px 0 4px; }
.admin-input, .admin-select {
  width: 100%;
  border: 1.5px solid var(--line);
  border-radius: 10px;
  padding: 8px 12px;
  font-size: 14px; font-family: var(--font);
  outline: none;
  background: #fff;
  transition: border-color .15s;
}
.admin-input:focus, .admin-select:focus { border-color: var(--green); }
.admin-check { display: flex; align-items: center; gap: 8px; margin-top: 12px; font-size: 14px; color: var(--ink-soft); cursor: pointer; }
.admin-check input { width: 17px; height: 17px; accent-color: var(--green); }
.admin-vocab-row {
  display: grid;
  grid-template-columns: 1.1fr 1.1fr 1.4fr auto;
  gap: 6px;
  margin-bottom: 6px;
  align-items: center;
}
.admin-del {
  border: none; background: var(--coral-wash); color: #a33a1e;
  width: 30px; height: 30px; border-radius: 9px;
  font-weight: 700;
  transition: filter .15s;
}
.admin-del:hover { filter: brightness(.95); }
@media (min-width: 0px) {
  .admin-vocab-row { grid-template-columns: 1fr 1fr; }
  .admin-vocab-row .v-ex { grid-column: 1 / 2; }
}

/* ============ Building mode ============ */
.build-fab {
  position: fixed; right: 18px; bottom: 84px; z-index: 90;
  width: 54px; height: 54px; border-radius: 50%;
  border: none;
  background: var(--gold); color: #2b1d04;
  font-size: 23px;
  box-shadow: 0 8px 22px rgba(240, 165, 46, .45);
  transition: transform .15s;
}
.build-fab:hover { transform: scale(1.08); }
.build-fab.active { background: var(--cta); color: #fff; box-shadow: 0 8px 22px rgba(244, 88, 122, .5); }
.build-panel {
  position: fixed; right: 18px; bottom: 148px; z-index: 90;
  width: 270px;
  background: var(--panel);
