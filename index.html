<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RealTalk English — Real life English for life abroad</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
</head>
<body>
<style>
/* ============ RealTalk English — design tokens ============ */
:root {
  --bg: #faf6ef;
  --panel: #ffffff;
  --ink: #221f1a;
  --ink-soft: #5c564c;
  --ink-faint: #948c7e;
  --line: #e8e1d4;

  --green: #1e6f54;        /* eucalyptus — primary */
  --green-deep: #14483a;
  --green-dark: #0f3229;   /* sidebar */
  --green-wash: #e4f0ea;

  --gold: #d99a2b;
  --gold-wash: #faf0da;

  --coral: #cf4f33;
  --coral-wash: #fbe8e2;

  --cream-text: #f4efe3;
  --side-label: #7fa892;
  --side-label-sub: #6a9280;
  --side-done: #8fd4ae;
  --flag-strip: linear-gradient(90deg, #12432f 0 50%, #d99a2b 50%);
  --hero-end: #1d5f47;

  --radius: 14px;
  --radius-sm: 9px;
  --shadow: 0 1px 2px rgba(34, 31, 26, .05), 0 6px 18px rgba(34, 31, 26, .06);
  --font: "Segoe UI Variable Text", "Segoe UI", -apple-system, "Helvetica Neue", Arial, sans-serif;
  --font-display: "Fraunces", Georgia, "Times New Roman", serif;
}

/* ============ Country themes (switched via data-accent on <html>) ============ */
/* Semantic colors (gold=caution, coral=error) stay constant; identity colors swap. */
html[data-accent="us"] {
  --bg: #f7f6f2;
  --green: #2b4f87; --green-deep: #1c3862; --green-dark: #101d33; --green-wash: #e3ebf5;
  --side-label: #8298bf; --side-label-sub: #6f86ad; --side-done: #93b6e8;
  --flag-strip: linear-gradient(90deg, #b22234 0 33.3%, #f2efe8 33.3% 66.6%, #3c3b6e 66.6%);
  --hero-end: #2d4f8c;
}
html[data-accent="uk"] {
  --bg: #f8f4ef;
  --green: #7d2436; --green-deep: #571826; --green-dark: #23090f; --green-wash: #f2e2e6;
  --side-label: #bf8f9b; --side-label-sub: #a67783; --side-done: #e0a3b0;
  --flag-strip: linear-gradient(90deg, #012169 0 33.3%, #f2efe8 33.3% 66.6%, #C8102F 66.6%);
  --hero-end: #6e2033;
}
html[data-accent="ca"] {
  --bg: #faf5f0;
  --green: #a32638; --green-deep: #7a1c2b; --green-dark: #350d13; --green-wash: #f7e3e6;
  --side-label: #c09297; --side-label-sub: #a67a7f; --side-done: #e8a3ab;
  --flag-strip: linear-gradient(90deg, #d52b1e 0 25%, #f5f1ea 25% 75%, #d52b1e 75%);
  --hero-end: #93283a;
}
html[data-accent="ie"] {
  --bg: #f6f8f3;
  --green: #17805c; --green-deep: #0e5a40; --green-dark: #06281d; --green-wash: #ddf0e7;
  --side-label: #7fbf9f; --side-label-sub: #67a687; --side-done: #8fdcb4;
  --flag-strip: linear-gradient(90deg, #169b62 0 33.3%, #f2efe8 33.3% 66.6%, #ff883e 66.6%);
  --hero-end: #14734f;
}
html[data-accent="sco"] {
  --bg: #f5f5f9;
  --green: #35508f; --green-deep: #243763; --green-dark: #131b30; --green-wash: #e4e8f4;
  --side-label: #8f9cc0; --side-label-sub: #7684a8; --side-done: #9db1e0;
  --flag-strip: linear-gradient(90deg, #005EB8 0 40%, #f2efe8 40% 60%, #005EB8 60%);
  --hero-end: #2c4278;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--ink);
  line-height: 1.55;
  font-size: 15.5px;
}
button { font-family: inherit; cursor: pointer; }
a { color: var(--green); }

/* ============ Layout ============ */
.app { display: flex; min-height: 100vh; }

.sidebar {
  width: 248px;
  flex-shrink: 0;
  background: var(--green-dark);
  color: var(--cream-text);
  display: flex;
  flex-direction: column;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
}

.brand {
  display: flex; align-items: center; gap: 10px;
  padding: 20px 18px 14px;
}
.brand-mark { font-size: 26px; }
.brand-name { display: block; font-weight: 700; font-size: 20px; letter-spacing: .2px; font-family: var(--font-display); }
.brand-sub { display: block; font-size: 11px; letter-spacing: 2.2px; text-transform: uppercase; color: var(--side-label); }

.nav { flex: 1; padding: 4px 10px 16px; }
.nav-label {
  font-size: 10.5px; letter-spacing: 1.8px; text-transform: uppercase;
  color: var(--side-label); padding: 16px 10px 6px;
}
.nav-label.sub { padding-top: 10px; color: var(--side-label-sub); font-size: 10px; }
.nav-item {
  display: flex; align-items: center; gap: 9px;
  padding: 8px 10px;
  border-radius: var(--radius-sm);
  color: var(--cream-text);
  text-decoration: none;
  font-size: 14.5px;
  margin-bottom: 2px;
  border: 1px solid transparent;
}
.nav-item:hover { background: rgba(255, 255, 255, .07); }
.nav-item.active { background: rgba(255, 255, 255, .12); border-color: rgba(255, 255, 255, .12); font-weight: 600; }
.nav-emoji { width: 20px; text-align: center; font-size: 15px; }
.nav-done { margin-left: auto; font-size: 11px; color: var(--side-done); }

.sidebar-foot { padding: 12px 16px; border-top: 1px solid rgba(255,255,255,.1); }
.sound-toggle {
  width: 100%;
  background: rgba(255,255,255,.08); color: var(--cream-text);
  border: 1px solid rgba(255,255,255,.15);
  border-radius: var(--radius-sm);
  padding: 7px 10px; font-size: 13px;
}
.sound-toggle:hover { background: rgba(255,255,255,.14); }

.content { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.main { min-width: 0; padding: 26px 42px 80px; max-width: 1060px; width: 100%; }

/* ============ Accent topbar ============ */
.topbar {
  position: sticky; top: 0; z-index: 40;
  display: flex; align-items: center; gap: 7px; flex-wrap: wrap;
  padding: 14px 42px 12px;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
}
.topbar::before {
  content: "";
  position: absolute; top: 0; left: 0; right: 0; height: 4px;
  background: var(--flag-strip);
}
.accent-tagline {
  margin-left: auto;
  font-size: 12px; color: var(--ink-faint); font-style: italic;
}
.accent-label {
  font-size: 11px; letter-spacing: 1.8px; text-transform: uppercase;
  color: var(--ink-faint); font-weight: 700; margin-right: 4px;
}
.accent-btn {
  display: inline-flex; align-items: center; gap: 7px;
  background: var(--panel);
  border: 1.5px solid var(--line);
  border-radius: 99px;
  padding: 6px 13px;
  font-size: 13.5px; font-weight: 600; color: var(--ink-soft);
  transition: border-color .12s, background .12s, color .12s;
}
.accent-btn:hover { border-color: var(--green); }
.accent-btn.active {
  background: var(--green); border-color: var(--green); color: #fff;
}
.accent-flag { font-size: 15px; }

/* ============ Shared elements ============ */
.page-head { margin-bottom: 26px; }
.page-kicker {
  font-size: 11.5px; letter-spacing: 2px; text-transform: uppercase;
  color: var(--green); font-weight: 700; margin-bottom: 4px;
}
.page-title { font-size: 30px; font-weight: 600; letter-spacing: -.3px; font-family: var(--font-display); }
.page-blurb { color: var(--ink-soft); margin-top: 6px; max-width: 62ch; }

.card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 20px 22px;
}

.grid { display: grid; gap: 14px; }
.grid-2 { grid-template-columns: repeat(2, 1fr); }
.grid-3 { grid-template-columns: repeat(3, 1fr); }
.grid-4 { grid-template-columns: repeat(4, 1fr); }

.chip {
  display: inline-block;
  font-size: 12px; font-weight: 600;
  padding: 3px 10px;
  border-radius: 99px;
  background: var(--green-wash); color: var(--green-deep);
}
.chip.gold { background: var(--gold-wash); color: #8a5e10; }
.chip.coral { background: var(--coral-wash); color: #96351f; }

.btn {
  display: inline-flex; align-items: center; gap: 8px;
  background: var(--green); color: #fff;
  border: none; border-radius: var(--radius-sm);
  padding: 10px 18px;
  font-size: 14.5px; font-weight: 600;
  transition: background .15s;
}
.btn:hover { background: var(--green-deep); }
.btn.ghost {
  background: transparent; color: var(--green);
  border: 1.5px solid var(--green);
}
.btn.ghost:hover { background: var(--green-wash); }

/* ============ Home ============ */
.hero {
  background: linear-gradient(120deg, var(--green-dark), var(--green-deep) 70%, var(--hero-end));
  color: var(--cream-text);
  border-radius: 18px;
  padding: 30px 34px;
  margin-bottom: 26px;
  position: relative;
  overflow: hidden;
}
/* Scotland gets a subtle tartan weave over the hero */
html[data-accent="sco"] .hero {
  background:
    repeating-linear-gradient(45deg, rgba(255,255,255,.05) 0 2px, transparent 2px 16px),
    repeating-linear-gradient(-45deg, rgba(255,255,255,.05) 0 2px, transparent 2px 16px),
    repeating-linear-gradient(90deg, rgba(200,16,46,.08) 0 3px, transparent 3px 34px),
    linear-gradient(120deg, var(--green-dark), var(--green-deep) 70%, var(--hero-end));
}
/* The US hero gets a faint star field */
html[data-accent="us"] .hero {
  background:
    radial-gradient(circle at 12% 22%, rgba(255,255,255,.14) 0 1.5px, transparent 2.5px),
    radial-gradient(circle at 28% 68%, rgba(255,255,255,.10) 0 1.5px, transparent 2.5px),
    radial-gradient(circle at 44% 30%, rgba(255,255,255,.12) 0 1.5px, transparent 2.5px),
    radial-gradient(circle at 62% 74%, rgba(255,255,255,.10) 0 1.5px, transparent 2.5px),
    radial-gradient(circle at 79% 26%, rgba(255,255,255,.13) 0 1.5px, transparent 2.5px),
    radial-gradient(circle at 91% 60%, rgba(255,255,255,.10) 0 1.5px, transparent 2.5px),
    linear-gradient(120deg, var(--green-dark), var(--green-deep) 70%, var(--hero-end));
}
.hero h1 { font-size: 30px; letter-spacing: -.3px; margin-bottom: 8px; font-family: var(--font-display); font-weight: 600; }
.hero p { color: #cfe3d7; max-width: 58ch; position: relative; z-index: 2; }
.hero .btn { margin-top: 16px; background: var(--gold); color: #2b1d04; position: relative; z-index: 2; }
.hero .btn:hover { background: #e7ab3e; }
.hero-emoji { position: absolute; right: 30px; top: 20px; font-size: 74px; opacity: .5; filter: drop-shadow(0 6px 14px rgba(0,0,0,.35)); z-index: 2; }
.hero-postcards {
  margin-top: 18px; font-size: 21px; letter-spacing: 10px; opacity: .8;
  position: relative; z-index: 2;
}
.hero::after {
  content: "";
  position: absolute; right: -8px; bottom: -26px;
  font-family: var(--font-display); font-weight: 700;
  font-size: 98px; letter-spacing: 6px;
  color: rgba(255, 255, 255, .055);
  pointer-events: none; white-space: nowrap; z-index: 1;
}
html[data-accent="au"] .hero::after { content: "AUSTRALIA"; }
html[data-accent="us"] .hero::after { content: "AMERICA"; }
html[data-accent="uk"] .hero::after { content: "BRITAIN"; }
html[data-accent="ca"] .hero::after { content: "CANADA"; }
html[data-accent="ie"] .hero::after { content: "IRELAND"; }
html[data-accent="sco"] .hero::after { content: "SCOTLAND"; }

.stat-row { margin-bottom: 26px; }
.stat { text-align: left; }
.stat-num { font-size: 26px; font-weight: 700; color: var(--green-deep); }
.stat-cap { font-size: 12.5px; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 1px; }

.scenario-card {
  display: flex; flex-direction: column; gap: 6px;
  text-decoration: none; color: var(--ink);
  transition: transform .12s, box-shadow .12s;
  overflow: hidden;
  padding: 0 0 16px;
}
.scenario-card:hover { transform: translateY(-2px); box-shadow: 0 4px 8px rgba(34,31,26,.07), 0 12px 28px rgba(34,31,26,.09); }
.scenario-card .sc-head {
  height: 62px;
  display: flex; align-items: center; justify-content: center;
  font-size: 32px;
  margin-bottom: 6px;
  text-shadow: 0 3px 10px rgba(0,0,0,.35);
}
.scenario-card .sc-emoji { font-size: 30px; padding: 14px 16px 0; }
.scenario-card .sc-title { font-weight: 700; font-size: 16px; padding: 0 16px; font-family: var(--font-display); }
.scenario-card .sc-blurb { font-size: 13.5px; color: var(--ink-soft); flex: 1; padding: 0 16px; }
.scenario-card .sc-meta { display: flex; gap: 8px; align-items: center; margin-top: 4px; padding: 0 16px; }

.section-title {
  font-size: 19px; font-weight: 600; margin: 30px 0 14px;
  font-family: var(--font-display);
  display: flex; align-items: center; gap: 10px;
}
.section-title::before {
  content: "";
  width: 22px; height: 4px; border-radius: 99px;
  background: var(--green);
}

/* ============ Grammar ============ */
.lesson-list .card { margin-bottom: 12px; cursor: pointer; transition: border-color .15s; }
.lesson-list .card:hover { border-color: var(--green); }
.lesson-row { display: flex; align-items: center; gap: 14px; }
.lesson-row .l-emoji { font-size: 24px; }
.lesson-row .l-title { font-weight: 700; }
.lesson-row .l-sub { font-size: 13.5px; color: var(--ink-soft); }
.lesson-row .l-done { margin-left: auto; }

.compare-table { width: 100%; border-collapse: collapse; margin: 14px 0; font-size: 14.5px; }
.compare-table th {
  text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: 1px;
  color: var(--ink-faint); padding: 6px 10px; border-bottom: 2px solid var(--line);
}
.compare-table td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.compare-table .wrong { color: var(--coral); }
.compare-table .wrong::before { content: "✗ "; }
.compare-table .right { color: var(--green-deep); font-weight: 600; }
.compare-table .right::before { content: "✓ "; }

.callout {
  border-left: 4px solid var(--gold);
  background: var(--gold-wash);
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  padding: 12px 16px;
  margin: 14px 0;
  font-size: 14px;
}
.callout.br::before { content: "🇧🇷 Brazilian trap: "; font-weight: 700; }

.lesson-body h3 { margin: 22px 0 8px; font-size: 16.5px; }
.lesson-body p { margin-bottom: 10px; color: var(--ink-soft); }
.lesson-body p strong { color: var(--ink); }
.back-link {
  display: inline-block; margin-bottom: 16px;
  color: var(--green); text-decoration: none; font-weight: 600; font-size: 14px;
}

/* ============ Exercises / quiz ============ */
.quiz-option {
  display: block; width: 100%; text-align: left;
  background: var(--panel);
  border: 1.5px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 12px 16px;
  font-size: 15px;
  margin-bottom: 10px;
  transition: border-color .12s, background .12s;
}
.quiz-option:hover:not(:disabled) { border-color: var(--green); background: var(--green-wash); }
.quiz-option:disabled { cursor: default; }
.quiz-option.correct { border-color: var(--green); background: var(--green-wash); font-weight: 600; }
.quiz-option.incorrect { border-color: var(--coral); background: var(--coral-wash); }

.quiz-progress { font-size: 13px; color: var(--ink-faint); margin-bottom: 8px; }
.quiz-q { font-size: 18px; font-weight: 700; margin-bottom: 16px; }
.quiz-explain {
  background: var(--green-wash); border-radius: var(--radius-sm);
  padding: 12px 16px; margin-top: 12px; font-size: 14px;
}
.quiz-explain.bad { background: var(--coral-wash); }
.quiz-score { text-align: center; padding: 30px 0; }
.quiz-score .big { font-size: 44px; font-weight: 700; color: var(--green-deep); }

.progress-bar { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; margin-bottom: 18px; }
.progress-bar > div { height: 100%; background: var(--green); border-radius: 99px; transition: width .3s; }

/* ============ Scenario page ============ */
.tab-row {
  display: inline-flex; gap: 4px; margin-bottom: 22px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 99px;
  padding: 4px;
  box-shadow: var(--shadow);
  flex-wrap: wrap;
}
.tab-btn {
  background: transparent; border: none;
  border-radius: 99px; padding: 8px 16px;
  font-size: 14px; font-weight: 600; color: var(--ink-soft);
  transition: background .12s, color .12s;
}
.tab-btn:hover { background: var(--green-wash); color: var(--green-deep); }
.tab-btn.active { background: var(--green); color: #fff; }

.phrase-row { display: flex; justify-content: space-between; gap: 14px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.phrase-row:last-child { border-bottom: none; }
.phrase-en { font-weight: 600; }
.phrase-note { color: var(--ink-soft); font-size: 13.5px; text-align: right; max-width: 46%; }

.slang-chip {
  display: inline-block; margin: 0 8px 8px 0;
  background: var(--panel); border: 1px solid var(--line);
  border-radius: 99px; padding: 6px 14px; font-size: 13.5px;
}
.slang-chip b { color: var(--green-deep); }

/* ============ POV player ============ */
.player-wrap { max-width: 760px; }

.viewport {
  position: relative;
  aspect-ratio: 16 / 9;
  border-radius: 16px;
  overflow: hidden;
  background: #17150f;
  box-shadow: 0 10px 34px rgba(20, 18, 12, .35);
}
.viewport video { width: 100%; height: 100%; object-fit: cover; }

.vp-scene {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  transition: background 1s;
}
.vp-avatar { font-size: 92px; filter: drop-shadow(0 6px 18px rgba(0,0,0,.4)); transition: transform .3s; }
.vp-avatar.talking { animation: bob 0.55s ease-in-out infinite alternate; }
@keyframes bob { from { transform: translateY(0) } to { transform: translateY(-7px) } }

.vp-rec {
  position: absolute; top: 14px; left: 16px;
  display: flex; align-items: center; gap: 7px;
  color: #fff; font-size: 12px; font-weight: 700; letter-spacing: 1.5px;
  text-shadow: 0 1px 4px rgba(0,0,0,.6);
}
.vp-rec .dot { width: 9px; height: 9px; border-radius: 50%; background: #ff3b30; animation: blink 1.1s infinite; }
@keyframes blink { 0%, 60% { opacity: 1 } 61%, 100% { opacity: .25 } }

.vp-pov {
  position: absolute; top: 14px; right: 16px;
  color: rgba(255,255,255,.85); font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
  text-shadow: 0 1px 4px rgba(0,0,0,.6);
}

.vp-caption {
  position: absolute; left: 0; right: 0; bottom: 0;
  padding: 40px 22px 16px;
  background: linear-gradient(transparent, rgba(10, 9, 6, .88) 45%);
  color: #fff;
}
.vp-speaker { font-size: 11.5px; letter-spacing: 1.6px; text-transform: uppercase; color: #f5c76a; font-weight: 700; margin-bottom: 3px; }
.vp-speaker.you { color: #8fd4ae; }
.vp-line { font-size: 17.5px; font-weight: 600; line-height: 1.4; min-height: 25px; text-shadow: 0 1px 3px rgba(0,0,0,.5); }
.vp-mood {
  position: absolute; bottom: 14px; right: 16px;
  font-size: 12px; background: rgba(0,0,0,.45); color: #fff;
  padding: 4px 10px; border-radius: 99px; backdrop-filter: blur(4px);
}

.swap-note { font-size: 12px; color: var(--ink-faint); text-align: right; margin-top: 7px; }

/* choices */
.choice-area { margin-top: 18px; min-height: 60px; }
.choice-prompt { font-size: 13px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--ink-faint); font-weight: 700; margin-bottom: 10px; }
.choice-btn {
  display: flex; align-items: flex-start; gap: 12px;
  width: 100%; text-align: left;
  background: var(--panel);
  border: 1.5px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 13px 16px;
  font-size: 15px;
  margin-bottom: 9px;
  transition: border-color .12s, background .12s, opacity .3s;
  animation: rise .25s ease both;
}
.choice-btn:nth-child(3) { animation-delay: .05s }
.choice-btn:nth-child(4) { animation-delay: .1s }
@keyframes rise { from { opacity: 0; transform: translateY(6px) } to { opacity: 1; transform: none } }
.choice-btn:hover:not(:disabled) { border-color: var(--green); background: var(--green-wash); }
.choice-btn:disabled { opacity: .45; cursor: default; }
.choice-letter {
  flex-shrink: 0;
  width: 24px; height: 24px; border-radius: 7px;
  background: var(--green-wash); color: var(--green-deep);
  font-size: 13px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  margin-top: 1px;
}

.feedback {
  border-radius: var(--radius-sm);
  padding: 13px 16px;
  margin-top: 6px;
  font-size: 14.5px;
  animation: rise .25s ease both;
}

<script>
// RealTalk — POV scene engine. Three modes share one viewport:
//   tap   — branching scene, answer by tapping choices
//   watch — the POV tab: auto-plays the whole conversation at real speed, plus the clip rack
//   speak — say your line out loud; speech recognition matches it to a branch
(function () {
  const MOOD_AVATARS = {
    friendly: "🙂", neutral: "😐", confused: "🤨", amused: "😄", awkward: "😬", worried: "😟"
  };
  const MOOD_LABELS = {
    friendly: "friendly", neutral: "neutral", confused: "confused…", amused: "amused", awkward: "awkward…", worried: "worried!"
  };
  const QUALITY_META = {
    natural: { cls: "natural", tag: "✓ Natural" },
    awkward: { cls: "awkward", tag: "~ A bit awkward" },
    wrong:   { cls: "wrong",   tag: "✗ Classic mistake" }
  };
  const WORD_MS = 260;
  const MATCH_THRESHOLD = 0.42;

  // ---------- speech synthesis ----------
  const speech = {
    enabled: true,
    voices: [],
    load() {
      if (!window.speechSynthesis) return;
      const set = () => { this.voices = speechSynthesis.getVoices(); };
      set();
      speechSynthesis.onvoiceschanged = set;
    },
    pick() {
      const vs = this.voices;
      if (!vs.length) return null;
      const accent = window.ACCENTS && window.ACCENTS[window.RT_ACCENT];
      const prefs = (accent && accent.voices) || ["en-AU", "en-GB"];
      for (const lang of prefs) {
        const re = new RegExp("^" + lang.replace(/-/g, "[-_]"), "i");
        const hit = vs.find(v => re.test(v.lang));
        if (hit) return hit;
      }
      return vs.find(v => /^en/i.test(v.lang)) || vs[0];
    },
    speak(text, { isYou = false, onEnd }) {
      if (!this.enabled || !window.speechSynthesis || !text) { onEnd && onEnd(false); return null; }
      speechSynthesis.cancel();
      const clean = text.replace(/\(.*?\)/g, "").trim();
      if (!clean) { onEnd && onEnd(false); return null; }
      const u = new SpeechSynthesisUtterance(clean);
      const v = this.pick();
      if (v) u.voice = v;
      u.rate = 1.0;
      u.pitch = isYou ? 0.8 : 1.05;
      let done = false;
      const finish = () => { if (!done) { done = true; onEnd && onEnd(true); } };
      u.onend = finish;
      u.onerror = finish;
      const est = Math.max(1600, clean.split(/\s+/).length * 420);
      setTimeout(finish, est + 1500);
      speechSynthesis.speak(u);
      return u;
    },
    stop() { if (window.speechSynthesis) speechSynthesis.cancel(); }
  };
  speech.load();

  // ---------- speech recognition ----------
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const recognition = {
    supported: !!SR,
    active: null,
    listen({ onResult, onError }) {
      if (!SR) { onError("unsupported"); return; }
      this.stop();
      const r = new SR();
      const acc = window.ACCENTS[window.RT_ACCENT];
      r.lang = (acc && acc.recog) || "en-US";
      r.interimResults = false;
      r.maxAlternatives = 3;
      let got = false;
      r.onresult = (e) => {
        got = true;
        const alts = [...e.results[0]].map(a => a.transcript);
        onResult(alts);
      };
      r.onerror = (e) => { if (!got) onError(e.error || "error"); };
      r.onend = () => { if (!got) onError("no-speech"); this.active = null; };
      this.active = r;
      try { r.start(); } catch { onError("error"); }
    },
    stop() { if (this.active) { try { this.active.abort(); } catch {} this.active = null; } }
  };

  // Token-set similarity (Dice coefficient) for matching what you said to a choice.
  function normalize(s) {
    return (s || "").toLowerCase().replace(/\(.*?\)/g, "").replace(/[^a-z0-9'\s]/g, " ").split(/\s+/).filter(Boolean);
  }
  function similarity(a, b) {
    const ta = normalize(a), tb = normalize(b);
    if (!ta.length || !tb.length) return 0;
    const setB = [...tb];
    let common = 0;
    for (const w of ta) {
      const i = setB.indexOf(w);
      if (i >= 0) { common++; setB.splice(i, 1); }
    }
    return (2 * common) / (ta.length + tb.length);
  }

  // ---------- player ----------
  class ScenePlayer {
    constructor(container, scenario, { mode = "tap", onComplete } = {}) {
      this.root = container;
      this.sc = scenario;
      this.scene = scenario.scene;
      this.mode = mode;
      this.onComplete = onComplete;
      this.counts = { natural: 0, awkward: 0, wrong: 0 };
      this.missed = [];
      this.timers = [];
      this.destroyed = false;
      this.renderShell();
      if (mode === "watch") this.renderWatchIntro();
      else this.goto(this.scene.start);
    }

    destroy() {
      this.destroyed = true;
      speech.stop();
      recognition.stop();
      this.timers.forEach(clearTimeout);
      this.timers = [];
    }
    later(fn, ms) { this.timers.push(setTimeout(() => { if (!this.destroyed) fn(); }, ms)); }

    renderShell() {
      const [c1, c2] = this.sc.bg || ["#333", "#666"];
      const modeLabel = this.mode === "watch" ? "POV · full conversation" : this.mode === "speak" ? "POV · speaking practice" : "POV · you choose";
      this.root.innerHTML = `
        <div class="player-wrap">
          <p class="page-blurb" style="margin-bottom:14px">🎬 <em>${T(this.scene.setting)}</em></p>
          <div class="viewport">
            <div class="vp-scene" style="background:radial-gradient(ellipse at 60% 35%, ${c2}, ${c1})">
              <div class="vp-avatar" id="vp-avatar">🙂</div>
            </div>
            <video id="vp-video" style="display:none" playsinline></video>
            <div class="vp-rec"><span class="dot"></span> REC</div>
            <div class="vp-pov">${modeLabel}</div>
            <div class="vp-mood" id="vp-mood" style="display:none"></div>
            <div class="vp-caption">
              <div class="vp-speaker" id="vp-speaker"></div>
              <div class="vp-line" id="vp-line"></div>
            </div>
          </div>
          <div class="swap-note" id="voice-note">placeholder scene — drop real Meta-glasses clips into <code>clips/</code> and add <code>video:</code> to any node</div>
          <div class="choice-area" id="choice-area"></div>
          <div id="clip-rack"></div>
        </div>`;
      this.$avatar = this.root.querySelector("#vp-avatar");
      this.$video = this.root.querySelector("#vp-video");
      this.$mood = this.root.querySelector("#vp-mood");
      this.$speaker = this.root.querySelector("#vp-speaker");
      this.$line = this.root.querySelector("#vp-line");
      this.$choices = this.root.querySelector("#choice-area");
      this.$rack = this.root.querySelector("#clip-rack");

      setTimeout(() => {
        if (this.destroyed) return;
        const acc = window.ACCENTS && window.ACCENTS[window.RT_ACCENT];
        const v = speech.pick();
        const noteEl = this.root.querySelector("#voice-note");
        if (noteEl && acc && v && !acc.voices.some(l => v.lang.toLowerCase().startsWith(l.slice(0, 5).toLowerCase()))) {
          noteEl.innerHTML +=
            ` · no ${acc.name} voice installed — using closest English voice (add voices in Windows Settings → Speech, or open in Chrome)`;
        }
      }, 700);
    }

    playLine({ speaker, text, isYou, mood }, cb) {
      speech.stop();
      this.timers.forEach(clearTimeout);
      this.timers = [];

      this.$speaker.textContent = speaker;
      this.$speaker.className = "vp-speaker" + (isYou ? " you" : "");
      this.$line.textContent = "";

      if (mood && !isYou) {
        this.$avatar.textContent = MOOD_AVATARS[mood] || "🙂";
        this.$mood.textContent = MOOD_LABELS[mood] || mood;
        this.$mood.style.display = "block";
      } else if (isYou) {
        this.$mood.style.display = "none";
      }
      this.$avatar.classList.add("talking");

      const words = text.split(/\s+/);
      let i = 0;
      const reveal = () => {
        i++;
        this.$line.textContent = words.slice(0, i).join(" ");
        if (i < words.length) this.later(reveal, WORD_MS);
      };
      reveal();

      let captionDone = false, voiceDone = false, called = false;
      const maybeDone = () => {
        if (called || !(captionDone && voiceDone) || this.destroyed) return;
        called = true;
        this.$avatar.classList.remove("talking");
        cb && cb();
      };
      this.later(() => { captionDone = true; maybeDone(); }, words.length * WORD_MS + 250);
      speech.speak(text, { isYou, onEnd: () => { voiceDone = true; maybeDone(); } });
      if (!speech.enabled || !window.speechSynthesis) voiceDone = true;
    }

    // ================= tap & speak modes =================
    goto(id) {
      const node = this.scene.nodes[id];
      if (!node) { console.error("Missing node:", id); return; }
      this.node = node;
      this.$choices.innerHTML = "";

      if (node.video) {
        this.$video.src = node.video;
        this.$video.style.display = "block";
        this.$video.play().catch(() => {});
      } else {
        this.$video.style.display = "none";
      }

      const isNarr = node.who === "narrator";
      this.playLine({
        speaker: isNarr ? "· scene ·" : T(node.name),
        text: T(node.line),
        isYou: false,
        mood: isNarr ? null : (node.mood || "friendly")
      }, () => this.afterLine(node));
    }

    afterLine(node) {
      if (node.note) {
        const tip = document.createElement("div");
        tip.className = "tip-note";
        tip.textContent = T(node.note);
        this.$choices.appendChild(tip);
      }
      if (node.end) return this.showEnd(node);
      if (node.choices && node.choices.length) {
        return this.mode === "speak" ? this.showSpeakPrompt(node) : this.showChoices(node);
      }
      if (node.next) {
        const btn = document.createElement("button");
        btn.className = "btn continue-btn";
        btn.textContent = "Continue ▸";
        btn.onclick = () => this.goto(node.next);
        this.$choices.appendChild(btn);
      }
    }

    showChoices(node) {
      const prompt = document.createElement("div");
      prompt.className = "choice-prompt";
      prompt.textContent = "What do you say?";
      this.$choices.appendChild(prompt);

      node.choices.forEach((ch, idx) => {
        const b = document.createElement("button");
        b.className = "choice-btn";
        b.innerHTML = `<span class="choice-letter">${"ABC"[idx] || "•"}</span><span>${T(ch.say)}</span>`;
        b.onclick = () => this.pick(node, ch);
        this.$choices.appendChild(b);
      });
    }

    // ---------- speak mode ----------
    showSpeakPrompt(node, retryMsg) {
      this.$choices.querySelector(".speak-box")?.remove();
      const box = document.createElement("div");
      box.className = "speak-box";
      box.innerHTML = `
        <div class="choice-prompt">🎙️ Your turn — say one of these out loud</div>
        ${node.choices.map((ch, i) => `
          <div class="speak-option" data-i="${i}">
            <span class="choice-letter">${"ABC"[i] || "•"}</span>
            <span>${T(ch.say)}</span>
          </div>`).join("")}
        <div class="mic-row">
          <button class="mic-btn" id="mic-btn" title="Tap, then speak">🎙️</button>
          <div class="mic-hint" id="mic-hint">${retryMsg || "Tap the mic, then say your line"}</div>
        </div>`;
      this.$choices.appendChild(box);

      // tapping an option is always allowed — speaking is practice, not a wall
      box.querySelectorAll(".speak-option").forEach(el => {
        el.onclick = () => { recognition.stop(); this.pick(node, node.choices[+el.dataset.i]); };
      });

      const micBtn = box.querySelector("#mic-btn");
      const hint = box.querySelector("#mic-hint");

      if (!recognition.supported) {
        micBtn.disabled = true;
        micBtn.style.opacity = ".4";
        hint.textContent = "Speech recognition isn't available in this browser (try Chrome or Edge) — tap your line instead.";
        return;
      }

      micBtn.onclick = () => {
        micBtn.classList.add("listening");
        hint.textContent = "Listening… speak now";
        recognition.listen({
          onResult: (alts) => {
            if (this.destroyed) return;
            micBtn.classList.remove("listening");
            this.handleSpeech(node, alts, box);
          },
          onError: (err) => {
            if (this.destroyed) return;
            micBtn.classList.remove("listening");
            hint.textContent = err === "not-allowed"
              ? "Microphone blocked — allow mic access in the browser, or tap your line instead."
              : err === "no-speech"
                ? "Didn't hear anything — tap the mic and try again, a bit louder."
                : "Mic hiccup — try again, or tap your line instead.";
          }
        });
      };
    }

    handleSpeech(node, alts, box) {
      // best match across all recognition alternatives × all choices
      let best = { score: 0, choice: null, heard: alts[0] || "" };
      for (const alt of alts) {
        for (const ch of node.choices) {
          const s = similarity(alt, T(ch.say));
          if (s > best.score) best = { score: s, choice: ch, heard: alt };
        }
      }
      const hint = box.querySelector("#mic-hint");
      if (best.choice && best.score >= MATCH_THRESHOLD) {
        const pct = Math.round(best.score * 100);
        const heard = document.createElement("div");
        heard.className = "heard-box match";
        heard.innerHTML = `We heard: <em>"${best.heard}"</em> — <b>${pct}% match</b> ✓`;
        box.appendChild(heard);
        recognition.stop();
        this.later(() => this.pick(node, best.choice, { spoken: true, heard: best.heard, pct }), 900);
      } else {
        const heard = document.createElement("div");
        heard.className = "heard-box miss";
        heard.innerHTML = best.heard
          ? `We heard: <em>"${best.heard}"</em> — didn't match any line. In real life you'd hear:`
          : "Couldn't make that out. In real life you'd hear:";
        box.appendChild(heard);
        hint.textContent = "";
        this.playLine({
          speaker: T(node.name) || "Them", mood: "confused",
          text: "Sorry — what was that?", isYou: false
        }, () => {
          if (this.destroyed) return;
          box.querySelector("#mic-hint").textContent = "Perfect practice for real life! Tap the mic and try again — slower is fine.";
        });
      }
    }

    pick(node, ch, spoken) {
      const say = T(ch.say), fbText = T(ch.fb);
      this.counts[ch.quality] = (this.counts[ch.quality] || 0) + 1;
      if (ch.quality !== "natural") this.missed.push({ said: say, fb: fbText });

      this.$choices.querySelectorAll(".choice-btn").forEach(b => {
        b.disabled = true;
        if (!b.textContent.includes(say)) b.style.opacity = ".35";
      });
      this.$choices.querySelectorAll(".speak-option").forEach(el => {
        el.style.pointerEvents = "none";
        if (!el.textContent.includes(say)) el.style.opacity = ".35";
      });
      const micRow = this.$choices.querySelector(".mic-row");
      if (micRow) micRow.style.display = "none";

      this.playLine({ speaker: "You", text: say, isYou: true }, () => {
        const meta = QUALITY_META[ch.quality];
        const fb = document.createElement("div");
        fb.className = `feedback ${meta.cls}`;
        const spokeNote = spoken && spoken.spoken ? `<div class="spoke-note">🎙️ You said it out loud — ${spoken.pct}% match. That sentence is yours now.</div>` : "";
        fb.innerHTML = `<span class="fb-tag">${meta.tag}</span>${fbText}${spokeNote}`;
        this.$choices.appendChild(fb);

        const btn = document.createElement("button");
        btn.className = "btn continue-btn";
        btn.textContent = "Continue ▸";
        btn.onclick = () => this.goto(ch.next);
        this.$choices.appendChild(btn);
        btn.scrollIntoView({ behavior: "smooth", block: "nearest" });
      });
    }

    showEnd(node) {
      const c = this.counts;
      const total = c.natural + c.awkward + c.wrong;
      const wrap = document.createElement("div");
      wrap.className = "end-screen card";
      wrap.style.marginTop = "16px";

      let verdict;
      if (c.wrong === 0 && c.awkward === 0) verdict = "Flawless. You'd fool a local. 🏆";
      else if (c.wrong === 0) verdict = "Solid — a few rough edges, zero disasters. 💪";
      else if (c.wrong <= 2) verdict = "You survived — and the mistakes you made here, you'll never make out there. That's the point. 🎯";
      else verdict = "Chaotic — but every one of those reactions just became a memory. Replay and feel the difference. 🔁";
      if (this.mode === "speak") verdict += " And you did it with your actual voice — that's the real training.";

      wrap.innerHTML = `
        <h3 style="font-size:19px">Scene complete — ${this.sc.title} ${this.sc.emoji}</h3>
        <p style="color:var(--ink-soft);margin-top:4px">${verdict}</p>
        <div class="end-counts">
          <div class="end-count natural"><div class="n">${c.natural}</div>natural</div>
          <div class="end-count awkward"><div class="n">${c.awkward}</div>awkward</div>
          <div class="end-count wrong"><div class="n">${c.wrong}</div>classic mistakes</div>
        </div>
        ${this.missed.length ? `<h4 style="margin:14px 0 4px">Review your slips</h4>` +
          this.missed.map(m => `<div class="review-item"><div class="review-said">"${m.said}"</div><div class="review-fix">${m.fb}</div></div>`).join("") : ""}
        <div style="margin-top:18px;display:flex;gap:10px;flex-wrap:wrap">
          <button class="btn" id="replay-btn">↻ Replay scene</button>
          <a class="btn ghost" href="#/home">Back to scenarios</a>
        </div>`;
      this.$choices.appendChild(wrap);
      wrap.querySelector("#replay-btn").onclick = () => {
        this.destroy();
        new ScenePlayer(this.root, this.sc, { mode: this.mode, onComplete: this.onComplete });
      };
      this.onComplete && this.onComplete({ counts: { ...c }, total });
    }

    // ================= watch (POV) mode =================
    buildPath() {
      // main path: always take the first natural choice (fallback: first choice)
      const steps = [];
      const seen = new Set();
      let id = this.scene.start;
      while (id && !seen.has(id)) {
        seen.add(id);
        const node = this.scene.nodes[id];
        if (!node) break;
        steps.push({ kind: node.who === "narrator" ? "narrator" : "them", node });
        if (node.end) break;
        if (node.choices && node.choices.length) {
          const ch = node.choices.find(c => c.quality === "natural") || node.choices[0];
          steps.push({ kind: "you", say: T(ch.say), node });
          id = ch.next;
        } else {
          id = node.next;
        }
      }
      return steps;
    }

    renderWatchIntro() {
      this.path = this.buildPath();
      this.$choices.innerHTML = `
        <div class="watch-intro">
          <p class="page-blurb" style="margin-bottom:12px">This is the POV cut — the whole conversation at real speed, like standing there wearing the glasses. Watch it once before you play it. <b>${this.path.length} lines.</b></p>
          <button class="btn" id="watch-btn">▶ Watch the conversation</button>
        </div>`;
      this.$choices.querySelector("#watch-btn").onclick = () => {
        this.$choices.innerHTML = "";
        this.playWatch(0);
      };
      this.renderClipRack();
    }

    playWatch(i) {
      if (this.destroyed) return;
      if (i >= this.path.length) return this.watchEnd();
      const step = this.path[i];
      this.$choices.innerHTML = `<div class="watch-progress">▶ line ${i + 1} of ${this.path.length} · <a href="#" id="watch-skip">skip to end</a></div>`;
      this.$choices.querySelector("#watch-skip").onclick = (e) => { e.preventDefault(); speech.stop(); this.watchEnd(); };

      this.rackHighlight(i);
      if (step.kind === "you") {
        this.playLine({ speaker: "You", text: step.say, isYou: true }, () => this.later(() => this.playWatch(i + 1), 350));
      } else {
        const node = step.node;
        if (node.video) { this.$video.src = node.video; this.$video.style.display = "block"; this.$video.play().catch(() => {}); }
        else this.$video.style.display = "none";
        this.playLine({
          speaker: step.kind === "narrator" ? "· scene ·" : T(node.name),
          text: T(node.line),
          isYou: false,
          mood: step.kind === "narrator" ? null : (node.mood || "friendly")
        }, () => this.later(() => this.playWatch(i + 1), 350));
      }
    }

    watchEnd() {
      this.$choices.innerHTML = `
        <div class="watch-intro card" style="margin-top:14px">
          <h3 style="margin-bottom:6px">That's the full conversation 🎬</h3>
          <p style="color:var(--ink-soft)">You just watched it happen. Now step into the glasses yourself:</p>
          <div style="margin-top:14px;display:flex;gap:10px;flex-wrap:wrap">
            <a class="btn" href="#/scenario/${this.sc.id}/play">🎬 Play it — tap your lines</a>
            <a class="btn ghost" href="#/scenario/${this.sc.id}/speak">🎙️ Speak it out loud</a>
            <button class="btn ghost" id="rewatch-btn">↻ Watch again</button>
          </div>
        </div>`;
      this.$choices.querySelector("#rewatch-btn").onclick = () => { this.$choices.innerHTML = ""; this.playWatch(0); };
      this.rackHighlight(-1);
    }

    renderClipRack() {
      const [c1, c2] = this.sc.bg || ["#333", "#666"];
      this.$rack.innerHTML = `
        <div class="section-title" style="margin-top:26px">📼 Clip rack — the real footage slots</div>
        <div class="clip-grid">
          ${this.path.map((step, i) => {
            const isYou = step.kind === "you";
            const text = isYou ? step.say : T(step.node.line);
            const speaker = isYou ? "You (POV)" : step.kind === "narrator" ? "Scene" : T(step.node.name);
            const hasVideo = !isYou && step.node.video;
            return `
              <div class="clip-card" data-i="${i}">
                <div class="clip-thumb" style="background:linear-gradient(135deg, ${c2}, ${c1})">
                  <span>${hasVideo ? "🎞️" : isYou ? "🕶️" : MOOD_AVATARS[step.node.mood] || "🙂"}</span>
                </div>
                <div class="clip-meta">
                  <div class="clip-speaker">${speaker}</div>
                  <div class="clip-text">${text.length > 64 ? text.slice(0, 64) + "…" : text}</div>
                  <span class="chip ${hasVideo ? "" : "gold"}" style="margin-top:5px">${hasVideo ? "🎥 footage ready" : "📼 awaiting footage"}</span>
                </div>
              </div>`;
          }).join("")}
        </div>
        <p class="swap-note" style="text-align:left;margin-top:10px">Each card is one clip to film with the glasses. Drop files in <code>clips/</code>, add <code>video: "clips/${this.sc.id}-&lt;node&gt;.mp4"</code> to the scene node, and the placeholder disappears.</p>`;
    }

    rackHighlight(activeIdx) {
      this.$rack.querySelectorAll(".clip-card").forEach(el => {
        el.classList.toggle("playing", +el.dataset.i === activeIdx);
      });
    }
  }

  window.RealTalkPlayer = { ScenePlayer, speech, recognition, similarity };
})();

</script>
<script>
// RealTalk — app shell: accent system, routing, pages, quiz engine, progress.
(function () {
  const ALL = [...(window.SCENARIOS_A || []), ...(window.SCENARIOS_B || []), ...(window.SCENARIOS_C || [])];
  const GROUP_ORDER = ["Daily Life", "Settling In", "Social", "Work"];
  const SCENARIOS = [];
  GROUP_ORDER.forEach(g => ALL.forEach(s => { if ((s.group || "Daily Life") === g) SCENARIOS.push(s); }));
  ALL.forEach(s => { if (!SCENARIOS.includes(s)) SCENARIOS.push(s); });

  // Base grammar lessons minus the static slang one — slang is accent-dynamic now.
  const GRAMMAR_BASE = (window.GRAMMAR || []).filter(l => l.id !== "aussie-slang");
  const EXERCISES = window.EXERCISES || [];
  const $main = document.getElementById("main");
  let activePlayer = null;

  const accentMeta = () => window.ACCENTS[window.RT_ACCENT];

  // Build the dynamic slang lesson for the current accent.
  function slangLesson() {
    const p = window.SLANG_PACKS[window.RT_ACCENT];
    return {
      id: "local-slang",
      emoji: accentMeta().flag,
      title: p.title,
      sub: "The words standing between you and understanding anyone",
      sections: [
        { h: "Why everything sounds like that", p: p.intro },
        { h: "The starter pack", rows: p.rows },
        { h: "Decoder tips", list: p.tips }
      ]
    };
  }
  const grammarList = () => [...GRAMMAR_BASE, slangLesson()];

  // ---------- progress (localStorage) ----------
  const store = {
    key: "realtalk-progress",
    data: null,
    load() {
      try { this.data = JSON.parse(localStorage.getItem(this.key)) || {}; }
      catch { this.data = {}; }
      this.data.lessons = this.data.lessons || {};
      this.data.quizzes = this.data.quizzes || {};
      this.data.scenes = this.data.scenes || {};
      return this.data;
    },
    save() { localStorage.setItem(this.key, JSON.stringify(this.data)); },
    lessonRead(id) { this.data.lessons[id] = true; this.save(); renderNav(); },
    quizScore(id, score, total) {
      const prev = this.data.quizzes[id];
      if (!prev || score > prev.score) this.data.quizzes[id] = { score, total };
      this.save(); renderNav();
    },
    sceneDone(id, counts) { this.data.scenes[id] = { done: true, counts }; this.save(); renderNav(); }
  };
  store.load();

  // ---------- accent bar ----------
  function applyTheme() {
    document.documentElement.dataset.accent = window.RT_ACCENT;
  }

  function renderAccentBar() {
    const bar = document.getElementById("accent-bar");
    bar.innerHTML = `
      <span class="accent-label">Accent</span>
      ${Object.entries(window.ACCENTS).map(([code, a]) => `
        <button class="accent-btn ${code === window.RT_ACCENT ? "active" : ""}" data-accent="${code}" title="${a.name} English">
          <span class="accent-flag">${a.flag}</span><span class="accent-name">${a.name}</span>
        </button>`).join("")}
      <span class="accent-tagline">${accentMeta().motif} ${accentMeta().tagline}</span>`;
    bar.querySelectorAll(".accent-btn").forEach(btn => {
      btn.onclick = () => {
        window.RT_ACCENT = btn.dataset.accent;
        localStorage.setItem("realtalk-accent", window.RT_ACCENT);
        applyTheme();
        renderAccentBar();
        route(); // re-render everything in the new accent
      };
    });
  }

  // ---------- nav ----------
  function renderNav() {
    const nav = document.getElementById("scenario-nav");
    let html = "";
    GROUP_ORDER.forEach(g => {
      const items = SCENARIOS.filter(s => (s.group || "Daily Life") === g);
      if (!items.length) return;
      html += `<div class="nav-label sub">${g}</div>`;
      html += items.map(s => `
        <a class="nav-item" href="#/scenario/${s.id}" data-route="scenario/${s.id}">
          <span class="nav-emoji">${s.emoji}</span> ${s.title}
          ${store.data.scenes[s.id] ? '<span class="nav-done">✓</span>' : ""}
        </a>`).join("");
    });
    nav.innerHTML = html;
    highlightNav();
  }

  function highlightNav() {
    const route = location.hash.replace(/^#\//, "") || "home";
    document.querySelectorAll(".nav-item").forEach(a => {
      const r = a.dataset.route;
      a.classList.toggle("active", r === route || (r && route.startsWith(r + "/")) ||
        (r === "grammar" && route.startsWith("grammar")) ||
        (r === "exercises" && route.startsWith("exercises")));
    });
  }

  // ---------- pages ----------
  function pageHome() {
    const scenesDone = Object.keys(store.data.scenes).length;
    const lessonsRead = Object.keys(store.data.lessons).length;
    const quizzesDone = Object.keys(store.data.quizzes).length;
    const a = accentMeta();
    $main.innerHTML = `
      <div class="hero">
        <div class="hero-emoji">${a.motif}</div>
        <h1>${a.greeting}, Matheus 👋</h1>
        <p>This isn't school English. Every scene here is a real conversation from your first months abroad — in your point of view, with real choices, real mistakes and real reactions. You're currently training your ear for <strong>${a.name} English</strong> ${a.flag} — switch accents up top and watch every scene change.</p>
        <a class="btn" href="#/scenario/coffee">▶ Start with Ordering Coffee</a>
        <div class="hero-postcards">${a.postcards}</div>
      </div>

      <div class="grid grid-3 stat-row">
        <div class="card stat"><div class="stat-num">${scenesDone}/${SCENARIOS.length}</div><div class="stat-cap">scenes completed</div></div>
        <div class="card stat"><div class="stat-num">${lessonsRead}/${grammarList().length}</div><div class="stat-cap">grammar lessons read</div></div>
        <div class="card stat"><div class="stat-num">${quizzesDone}/${EXERCISES.length}</div><div class="stat-cap">quizzes attempted</div></div>
      </div>

      ${GROUP_ORDER.map(g => {
        const items = SCENARIOS.filter(s => (s.group || "Daily Life") === g);
        if (!items.length) return "";
        return `
          <div class="section-title">${g}</div>
          <div class="grid grid-4">
            ${items.map(s => `
              <a class="card scenario-card" href="#/scenario/${s.id}">
                <span class="sc-head" style="background:linear-gradient(135deg, ${s.bg ? s.bg[1] : "#666"}, ${s.bg ? s.bg[0] : "#333"})">${s.emoji}</span>
                <span class="sc-title">${s.title}</span>
                <span class="sc-blurb">${T(s.blurb)}</span>
                <span class="sc-meta">
                  <span class="chip ${s.level === "Beginner" ? "" : s.level === "Intermediate" ? "gold" : "coral"}">${s.level}</span>
                  ${store.data.scenes[s.id] ? '<span class="chip">✓ done</span>' : ""}
                </span>
              </a>`).join("")}
          </div>`;
      }).join("")}

      <div class="section-title">Study</div>
      <div class="grid grid-2">
        <a class="card scenario-card" href="#/grammar">
          <span class="sc-emoji">📚</span><span class="sc-title">Grammar</span>
          <span class="sc-blurb">Lessons built entirely around the mistakes Brazilians actually make — have vs be, prepositions, false friends, plus the ${accentMeta().name.toLowerCase()} slang decoder.</span>
        </a>
        <a class="card scenario-card" href="#/exercises">
          <span class="sc-emoji">✏️</span><span class="sc-title">Exercises</span>
          <span class="sc-blurb">Quick quizzes with instant explanations. Best scores are saved — beat yourself.</span>
        </a>
      </div>`;
  }

  function pageGrammar() {
    $main.innerHTML = `
      <div class="page-head">
        <div class="page-kicker">Study</div>
        <div class="page-title">📚 Grammar</div>
        <p class="page-blurb">Not a textbook — a trap map. Each lesson targets mistakes Portuguese speakers actually make, with the exact fix.</p>
      </div>
      <div class="lesson-list">
        ${grammarList().map(l => `
          <div class="card" onclick="location.hash='#/grammar/${l.id}'">
            <div class="lesson-row">
              <span class="l-emoji">${l.emoji}</span>
              <div><div class="l-title">${l.title}</div><div class="l-sub">${l.sub}</div></div>
              ${store.data.lessons[l.id] ? '<span class="chip l-done">✓ read</span>' : ""}
            </div>
          </div>`).join("")}
      </div>`;
  }

  function pageLesson(id) {
    const l = grammarList().find(x => x.id === id);
    if (!l) return pageGrammar();
    store.lessonRead(id);
    $main.innerHTML = `
      <a class="back-link" href="#/grammar">← All lessons</a>
      <div class="page-head">
        <div class="page-kicker">Grammar</div>
        <div class="page-title">${l.emoji} ${l.title}</div>
        <p class="page-blurb">${l.sub}</p>
      </div>
      <div class="card lesson-body">
        ${l.sections.map(s => `
          ${s.h ? `<h3>${s.h}</h3>` : ""}
          ${s.p ? `<p>${s.p}</p>` : ""}
          ${s.rows ? `<table class="compare-table">
              <tr>${s.rows[0].length === 3 && id === "local-slang"
                ? "<th>Word</th><th>Meaning</th><th>Example</th>"
                : "<th>Don't say</th><th>Say</th><th>Why</th>"}</tr>
              ${s.rows.map(r => id === "local-slang"
                ? `<tr><td class="right">${r[0]}</td><td>${r[1]}</td><td style="color:var(--ink-faint)">${r[2] || ""}</td></tr>`
                : `<tr><td class="wrong">${r[0]}</td><td class="right">${r[1]}</td><td>${r[2]}</td></tr>`).join("")}
            </table>` : ""}
          ${s.callout ? `<div class="callout br">${s.callout}</div>` : ""}
          ${s.list ? `<ul style="padding-left:22px;color:var(--ink-soft)">${s.list.map(i => `<li style="margin:5px 0">${i}</li>`).join("")}</ul>` : ""}
        `).join("")}
        <div style="margin-top:24px">
          <a class="btn" href="#/exercises">Practice this in Exercises →</a>
        </div>
      </div>`;
  }

  function pageExercises() {
    $main.innerHTML = `
      <div class="page-head">
        <div class="page-kicker">Study</div>
        <div class="page-title">✏️ Exercises</div>
        <p class="page-blurb">Short quizzes, instant explanations. Wrong answers teach more than right ones — that's the whole philosophy here.</p>
      </div>
      <div class="grid grid-2">
        ${EXERCISES.map(q => {
          const best = store.data.quizzes[q.id];
          return `
          <a class="card scenario-card" href="#/exercises/${q.id}">
            <span class="sc-emoji">${q.emoji}</span>
            <span class="sc-title">${q.title}</span>
            <span class="sc-blurb">${q.sub} · ${q.questions.length} questions</span>
            <span class="sc-meta">${best ? `<span class="chip">best: ${best.score}/${best.total}</span>` : '<span class="chip gold">not attempted</span>'}</span>
          </a>`;
        }).join("")}
      </div>`;
  }

  function pageQuiz(id) {
    const quiz = EXERCISES.find(x => x.id === id);
    if (!quiz) return pageExercises();
    let i = 0, score = 0;

    const render = () => {
      if (i >= quiz.questions.length) return renderScore();
      const q = quiz.questions[i];
      $main.innerHTML = `
        <a class="back-link" href="#/exercises">← All exercises</a>
        <div class="page-head">
          <div class="page-kicker">Exercise</div>
          <div class="page-title">${quiz.emoji} ${quiz.title}</div>
        </div>
        <div class="progress-bar"><div style="width:${(i / quiz.questions.length) * 100}%"></div></div>
        <div class="card">
          <div class="quiz-progress">Question ${i + 1} of ${quiz.questions.length} · score ${score}</div>
          <div class="quiz-q">${q.q}</div>
          <div id="quiz-opts">
            ${q.options.map((o, idx) => `<button class="quiz-option" data-i="${idx}">${o}</button>`).join("")}
          </div>
          <div id="quiz-fb"></div>
        </div>`;
      $main.querySelectorAll(".quiz-option").forEach(btn => {
        btn.onclick = () => {
          const chosen = +btn.dataset.i;
          const right = chosen === q.answer;
          if (right) score++;
          $main.querySelectorAll(".quiz-option").forEach((b, idx) => {
            b.disabled = true;
            if (idx === q.answer) b.classList.add("correct");
            else if (idx === chosen) b.classList.add("incorrect");
          });
          document.getElementById("quiz-fb").innerHTML = `
            <div class="quiz-explain ${right ? "" : "bad"}">
              <strong>${right ? "✓ Correct!" : "✗ Not quite."}</strong> ${q.explain}
            </div>
            <button class="btn continue-btn" id="next-q">${i + 1 < quiz.questions.length ? "Next question ▸" : "See result ▸"}</button>`;
          document.getElementById("next-q").onclick = () => { i++; render(); };
        };
      });
    };

    const renderScore = () => {
      store.quizScore(id, score, quiz.questions.length);
      const pct = Math.round((score / quiz.questions.length) * 100);
      const msg = pct === 100 ? "Perfect. Nothing to teach you here. 🏆"
        : pct >= 70 ? "Strong — reread the ones you missed and it's yours. 💪"
        : "The misses are the lesson. Read the explanations, then run it back. 🔁";
      $main.innerHTML = `
        <a class="back-link" href="#/exercises">← All exercises</a>
        <div class="card quiz-score">
          <div style="font-size:40px">${quiz.emoji}</div>
          <div class="big">${score}/${quiz.questions.length}</div>
          <p style="color:var(--ink-soft);margin:8px 0 20px">${msg}</p>
          <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
            <button class="btn" onclick="location.reload()">↻ Try again</button>
            <a class="btn ghost" href="#/exercises">All exercises</a>
          </div>
        </div>`;
    };
    render();
  }

  function pageScenario(id, tab) {
    const s = SCENARIOS.find(x => x.id === id);
    if (!s) return pageHome();
    tab = tab || "learn";
    const a = accentMeta();
    const TABS = [
      ["learn", "📖 Learn"],
      ["pov", "📹 POV"],
      ["play", "🎬 Play"],
      ["speak", "🎙️ Speak"]
    ];
    $main.innerHTML = `
      <div class="page-head">
        <div class="page-kicker">${s.group || "Real Life English"} · ${s.level} · ${a.flag} ${a.name} English</div>
        <div class="page-title">${s.emoji} ${s.title}</div>
        <p class="page-blurb">${T(s.blurb)}</p>
      </div>
      <div class="tab-row">
        ${TABS.map(([key, label]) => `<button class="tab-btn ${tab === key ? "active" : ""}" data-tab="${key}">${label}</button>`).join("")}
      </div>
      <div id="scenario-body"></div>`;
    $main.querySelectorAll(".tab-btn").forEach(btn => {
      btn.onclick = () => { location.hash = `#/scenario/${id}/${btn.dataset.tab}`; };
    });
    const body = document.getElementById("scenario-body");
    if (tab === "pov") {
      activePlayer = new RealTalkPlayer.ScenePlayer(body, s, { mode: "watch" });
    } else if (tab === "play" || tab === "speak") {
      activePlayer = new RealTalkPlayer.ScenePlayer(body, s, {
        mode: tab === "speak" ? "speak" : "tap",
        onComplete: ({ counts }) => store.sceneDone(id, counts)
      });
    } else {
      body.innerHTML = renderLearn(s);
    }
  }

  function renderLearn(s) {
    const L = s.learn;
    const a = accentMeta();
    const slang = T(L.slang) || [];
    return `
      <div class="card" style="margin-bottom:14px">
        <p style="color:var(--ink-soft)">${T(L.intro)}</p>
      </div>
      <div class="grid grid-2" style="align-items:start">
        <div class="card">
          <h3 style="margin-bottom:8px">🗝️ Key phrases</h3>
          ${L.phrases.map(p => `<div class="phrase-row"><span class="phrase-en">${T(p.en)}</span><span class="phrase-note">${T(p.note)}</span></div>`).join("")}
        </div>
        <div>
          <div class="card" style="margin-bottom:14px">
            <h3 style="margin-bottom:10px">${a.flag} Slang you'll hear</h3>
            ${slang.map(x => `<span class="slang-chip"><b>${T(x.term)}</b> — ${T(x.meaning)}</span>`).join("")}
          </div>
          <div class="card">
            <h3 style="margin-bottom:8px">💡 Insider tips</h3>
            <ul style="padding-left:20px;color:var(--ink-soft)">${L.tips.map(t => `<li style="margin:6px 0">${T(t)}</li>`).join("")}</ul>
          </div>
        </div>
      </div>
      <div class="card" style="margin-top:14px">
        <h3 style="margin-bottom:6px">🇧🇷 Brazilian traps in this situation</h3>
        <table class="compare-table">
          <tr><th>Don't say</th><th>Say</th><th>Why</th></tr>
          ${L.mistakes.map(m => `<tr><td class="wrong">${T(m.wrong)}</td><td class="right">${T(m.right)}</td><td>${T(m.why)}</td></tr>`).join("")}
        </table>
        <div style="margin-top:10px;display:flex;gap:10px;flex-wrap:wrap">
          <a class="btn" href="#/scenario/${s.id}/pov">📹 Watch the POV first</a>
          <a class="btn ghost" href="#/scenario/${s.id}/play">🎬 Play the scene</a>
          <a class="btn ghost" href="#/scenario/${s.id}/speak">🎙️ Speak it</a>
        </div>
      </div>`;
  }

  // ---------- router ----------
  function route() {
    if (activePlayer) { activePlayer.destroy(); activePlayer = null; }
    const parts = (location.hash.replace(/^#\//, "") || "home").split("/");
    window.scrollTo(0, 0);
    switch (parts[0]) {
      case "grammar": parts[1] ? pageLesson(parts[1]) : pageGrammar(); break;
      case "exercises": parts[1] ? pageQuiz(parts[1]) : pageExercises(); break;
      case "scenario": pageScenario(parts[1], parts[2]); break;
      default: pageHome();
    }
    highlightNav();
  }

  // ---------- sound toggle ----------
  const soundBtn = document.getElementById("sound-toggle");
  soundBtn.onclick = () => {
    RealTalkPlayer.speech.enabled = !RealTalkPlayer.speech.enabled;
    if (!RealTalkPlayer.speech.enabled) RealTalkPlayer.speech.stop();
    soundBtn.textContent = RealTalkPlayer.speech.enabled ? "🔊 Voice on" : "🔇 Voice off";
  };

  window.addEventListener("hashchange", route);
  applyTheme();
  renderAccentBar();
  renderNav();
  route();
})();

</script>
</body>
</html>
